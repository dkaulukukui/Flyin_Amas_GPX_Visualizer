          const alignIdx = match.index;

          const alignPointTime = timesMs[alignIdx];
          if (alignedTiming.spanMs > 0 && !isNaN(alignPointTime)) {
            const tau = (progressPercent / 100) * alignedTiming.spanMs;
            return headAtTime(alignIdx, alignPointTime + tau);
          }

          // No usable timestamps - pace by point index instead (the align
          // point itself is always shown, hence the +1)
          return headAtCount(alignIdx, (progressPercent / 100) * alignedTiming.maxRemainingPoints + 1);
        }

        if (animationStyle === 'sequential') {
          const trackIndex = effectiveTracks.findIndex(t => t.id === track.id);
          const tracksBeforeThis = effectiveTracks.slice(0, trackIndex);
          const totalPointsBefore = tracksBeforeThis.reduce((sum, t) => sum + t.points.length, 0);
          const totalPoints = effectiveTracks.reduce((sum, t) => sum + t.points.length, 0);
          const exactTotalPoint = (progressPercent / 100) * totalPoints;
          return headAtCount(0, Math.min(exactTotalPoint - totalPointsBefore, points.length));
        }

        // Simultaneous - use absolute time-based synchronization if available
        if (track.duration && track.startTime && simultaneousSpan) {
          const currentAbsoluteTime = simultaneousSpan.earliestStart + (progressPercent / 100) * simultaneousSpan.spanMs;
          if (currentAbsoluteTime < track.startTime.getTime()) {
            return null;
          }
          return headAtTime(0, currentAbsoluteTime);
        }

        // Fallback to percentage-based if no time data
        return headAtCount(0, (progressPercent / 100) * points.length);
      };

      // Interpolated head position ({lat, lon}) for a head state
      const getHeadPoint = (track, head) => {
        const { points } = track;
        return head.frac > 0 && head.index + 1 < points.length
          ? lerpPoint(points[head.index], points[head.index + 1], Math.min(head.frac, 1))
          : points[head.index];
      };

      // Points of a track visible at the given progress; the last one is the
      // interpolated head (see getHeadState)
      const getVisiblePoints = (track, progressPercent) => {
        const head = getHeadState(track, progressPercent);
        if (!head) return [];
        const visible = track.points.slice(head.from, head.index + 1);
        if (head.frac > 0 && head.index + 1 < track.points.length) {
          visible.push(getHeadPoint(track, head));
        }
        return visible;
      };

      // ---- Scoreboard stats (see STAT_DEFINITIONS) ----

      // Point fields present in any track (gates stats with `requires`)
      const availableFields = useMemo(() => {
        const fields = new Set();
        effectiveTracks.forEach(track => track.points.forEach(p => {
          Object.keys(GPX_EXTENSION_FIELDS).forEach(key => { if (p[key] !== undefined) fields.add(key); });
        }));
        return fields;
      }, [effectiveTracks]);

      const isStatAvailable = (def) => {
        if (def.requires && !availableFields.has(def.requires)) return false;
        if (def.scope === 'pair' && effectiveTracks.length < 2) return false;
        return true;
      };

      const activeStats = STAT_DEFINITIONS.filter(def => statsEnabled[def.id] && isStatAvailable(def));

      // The two tracks compared by pair stats (defaults: first two tracks)
      const gapTracks = (() => {
        const find = (id) => effectiveTracks.find(t => t.id == id); // == handles string ids from <select>
        const a = find(statsGapIds[0]) || effectiveTracks[0];
        const b = find(statsGapIds[1]) || effectiveTracks.find(t => t !== a);
        return a && b && a !== b ? [a, b] : null;
      })();

      // Race clock (ms) at a progress: the animation mode's common timeline, or
      // null when there isn't one (sequential mode / tracks without timestamps)
      const getRaceClockMs = (progressPercent) => {
        if (alignmentActive) {
          return alignedTiming.spanMs > 0 ? (progressPercent / 100) * alignedTiming.spanMs : null;
        }
        if (animationStyle === 'simultaneous' && simultaneousSpan) {
          return (progressPercent / 100) * simultaneousSpan.spanMs;
        }
        return null;
      };

      // Value of a per-point array (timesMs, cumDistM) at an interpolated head
      const valueAtHead = (values, head) => {
        const a = values[head.index];
        const b = values[head.index + 1];
        return head.frac > 0 && Number.isFinite(b) ? a + (b - a) * head.frac : a;
      };

      // Average speed (m/s) over the last SPEED_WINDOW_MS of track time
      const getSpeedAtHead = (track, head) => {
        const { timesMs, cumDistM } = track;
        const tHead = valueAtHead(timesMs, head);
        if (isNaN(tHead)) return null;
        const tTarget = tHead - SPEED_WINDOW_MS;
        let j = head.index;
        while (j > 0 && !(timesMs[j] <= tTarget)) j--;
        let tPrev = timesMs[j];
        let dPrev = cumDistM[j];
        const tNext = timesMs[j + 1];
        if (tPrev <= tTarget && tNext > tTarget) {
          const f = (tTarget - tPrev) / (tNext - tPrev);
          dPrev += (cumDistM[j + 1] - cumDistM[j]) * f;
          tPrev = tTarget;
        }
        const dt = tHead - tPrev;
        if (!(dt >= 2000)) return null; // too little history for a stable reading
        return (valueAtHead(cumDistM, head) - dPrev) / (dt / 1000);
      };

      // Latest sensor reading (e.g. hr) at the head, tolerating a few dropped samples
      const getFieldAtHead = (track, head, key) => {
        for (let i = head.index; i >= Math.max(head.from, head.index - 10); i--) {
          const v = track.points[i][key];
          if (Number.isFinite(v)) return v;
        }
        return null;
      };

      // Formatted scoreboard values at a progress:
      // { race: {statId: text}, tracks: {trackId: {statId: text}}, pair: {statId: text} }
      const computeScoreboardStats = (progressPercent) => {
        const result = { race: {}, tracks: {}, pair: {} };
        if (activeStats.length === 0) return result;
        const beforeStart = progressPercent < statsStartProgress;
        const show = (def, value) => (value === null || value === undefined || !Number.isFinite(value)
          ? '\u2014'
          : def.format(value, statsUnits));

        const heads = new Map();
        effectiveTracks.forEach(track => heads.set(track.id, getHeadState(track, progressPercent)));

        const clockNow = getRaceClockMs(progressPercent);
        const clockStart = getRaceClockMs(statsStartProgress);
        const raceCtx = { elapsedMs: clockNow !== null && clockStart !== null ? clockNow - clockStart : null };

        effectiveTracks.forEach(track => {
          const head = heads.get(track.id);
          const trackCtx = {
            get distanceM() {
              if (!head) return null;
              if (beforeStart) return 0;
              const startHead = getHeadState(track, statsStartProgress);
              const startDist = startHead ? valueAtHead(track.cumDistM, startHead) : track.cumDistM[head.from];
              return Math.max(0, valueAtHead(track.cumDistM, head) - startDist);
            },
            speedMps: () => (head ? getSpeedAtHead(track, head) : null),
            field: (key) => (head ? getFieldAtHead(track, head, key) : null)
          };
          result.tracks[track.id] = {};
          activeStats.filter(d => d.scope === 'track').forEach(def => {
            result.tracks[track.id][def.id] = show(def, def.compute(trackCtx));
          });
        });

        let pairCtx = { distanceM: null };
        if (gapTracks) {
          const [a, b] = gapTracks;
          const headA = heads.get(a.id);
          const headB = heads.get(b.id);
          if (headA && headB) {
            pairCtx = { distanceM: getDistance(getHeadPoint(a, headA), getHeadPoint(b, headB)) * 1000 };
          }
        }

        activeStats.forEach(def => {
          if (def.scope === 'race') result.race[def.id] = show(def, def.compute(raceCtx));
          if (def.scope === 'pair') result.pair[def.id] = show(def, def.compute(pairCtx));
        });
        return result;
      };

      // Draw the legend / scoreboard. Shared by the preview overlay canvas and
      // captureFrame so both are identical. Sizes are reference px x `scale`;
      // `bottomReserve` keeps a bottom-right panel above the watermark.
      const drawScoreboard = (ctx, frameWidth, frameHeight, scale, progressPercent, bottomReserve) => {
        const rows = effectiveTracks;
        if (rows.length === 0) return null;
        const layout = getLegendLayout(legendSize, scale);
        const stats = computeScoreboardStats(progressPercent);
        const raceDefs = activeStats.filter(d => d.scope === 'race');
        const trackDefs = activeStats.filter(d => d.scope === 'track');
        const pairDefs = gapTracks ? activeStats.filter(d => d.scope === 'pair') : [];
        const font = scoreboardFont;
        const itemFont = `${layout.itemFont}px ${font}`;
        const valueFont = `600 ${layout.itemFont}px ${font}`;
        const captionFont = `600 ${layout.titleFont}px ${font}`;
        const headerValueSize = layout.itemFont * 1.35;
        const headerValueFont = `700 ${headerValueSize}px ${font}`;
        const colGap = layout.barGap * 1.6;
        const captionGap = layout.barGap * 0.8;
        const supportsLetterSpacing = 'letterSpacing' in ctx;

        ctx.save();
        const measure = (text, f, spaced = false) => {
          ctx.font = f;
          if (supportsLetterSpacing) ctx.letterSpacing = spaced ? `${layout.titleLetterSpacing}px` : '0px';
          const w = ctx.measureText(text).width + (spaced && !supportsLetterSpacing ? text.length * layout.titleLetterSpacing : 0);
          if (supportsLetterSpacing) ctx.letterSpacing = '0px';
          return w;
        };
        const drawText = (text, x, y, f, color, align = 'left', spaced = false) => {
          ctx.font = f;
          ctx.fillStyle = color;
          ctx.textAlign = align;
          if (supportsLetterSpacing) ctx.letterSpacing = spaced ? `${layout.titleLetterSpacing}px` : '0px';
          ctx.fillText(text, x, y);
          if (supportsLetterSpacing) ctx.letterSpacing = '0px';
        };

        // Header: race stats (e.g. TIME 12:34), or the plain "TRACKS" caption
        const headerItems = raceDefs.map(def => ({
          caption: def.short || def.label.toUpperCase(),
          value: stats.race[def.id],
          width: Math.max(measure(def.template(statsUnits), headerValueFont), measure(stats.race[def.id], headerValueFont))
        }));
        let headerWidth;
        let headerHeight;
        if (headerItems.length > 0) {
          headerWidth = headerItems.reduce((sum, item, i) =>
            sum + (i > 0 ? colGap : 0) + measure(item.caption, captionFont, true) + captionGap + item.width, 0);
          headerHeight = headerValueSize * 1.2;
        } else {
          headerWidth = measure('TRACKS', captionFont, true);
          headerHeight = layout.titleHeight;
        }

        // Track rows: color bar, name, one right-aligned column per track stat
        const nameWidth = Math.max(...rows.map(t => measure(t.label, itemFont)));
        const columnWidths = trackDefs.map(def => Math.max(
          measure(def.template(statsUnits), valueFont),
          ...rows.map(t => measure(stats.tracks[t.id]?.[def.id] ?? '', valueFont))
        ));
        const rowWidth = layout.barWidth + layout.barGap + nameWidth +
          columnWidths.reduce((sum, w) => sum + colGap + w, 0);

        // Footer rows: pair stats (e.g. GAP Kai-Kimo 160 ft)
        const pairName = gapTracks ? `${gapTracks[0].label} \u2013 ${gapTracks[1].label}` : '';
        const footerItems = pairDefs.map(def => {
          const caption = def.short || def.label.toUpperCase();
          const valueWidth = Math.max(measure(def.template(statsUnits), valueFont), measure(stats.pair[def.id], valueFont));
          return {
            caption, value: stats.pair[def.id], valueWidth,
            width: measure(caption, captionFont, true) + captionGap + measure(pairName, itemFont) + colGap + valueWidth
          };
        });
        const footerHeight = footerItems.length * layout.rowHeight;

        const contentWidth = Math.max(headerWidth, rowWidth, ...footerItems.map(f => f.width));
        const panelWidth = 2 * layout.pad + contentWidth;
        const panelHeight = 2 * layout.pad + headerHeight + layout.titleGap + rows.length * layout.rowHeight +
          (footerItems.length > 0 ? layout.titleGap + footerHeight : 0);

        const isRight = legendPosition === 'top-right' || legendPosition === 'bottom-right';
        const isTop = legendPosition === 'top-left' || legendPosition === 'top-right';
        const bottomMargin = isRight ? Math.max(layout.margin, bottomReserve) : layout.margin;
        const x0 = isRight ? frameWidth - panelWidth - layout.margin : layout.margin;
        const y0 = isTop ? layout.margin : frameHeight - panelHeight - bottomMargin;

        // Background
        ctx.fillStyle = 'rgba(45, 45, 45, 0.95)';
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(x0, y0, panelWidth, panelHeight, layout.radius);
        } else {
          ctx.rect(x0, y0, panelWidth, panelHeight);
        }
        ctx.fill();
        ctx.textBaseline = 'middle';

        const left = x0 + layout.pad;
        const right = x0 + panelWidth - layout.pad;
        let y = y0 + layout.pad;

        // Header
        const headerMid = y + headerHeight / 2;
        if (headerItems.length > 0) {
          let x = left;
          headerItems.forEach((item, i) => {
            if (i > 0) x += colGap;
            drawText(item.caption, x, headerMid, captionFont, '#999', 'left', true);
            x += measure(item.caption, captionFont, true) + captionGap;
            drawText(item.value, x, headerMid, headerValueFont, '#ffffff');
            x += item.width;
          });
        } else {
          drawText('TRACKS', left, headerMid, captionFont, '#999', 'left', true);
        }
        y += headerHeight + layout.titleGap;

        // Track rows
        rows.forEach(track => {
          const mid = y + layout.rowHeight / 2;
          ctx.fillStyle = track.color;
          ctx.fillRect(left, mid - layout.barHeight / 2, layout.barWidth, layout.barHeight);
          drawText(track.label, left + layout.barWidth + layout.barGap, mid, itemFont, '#ffffff');
          let colRight = left + layout.barWidth + layout.barGap + nameWidth;
          trackDefs.forEach((def, i) => {
            colRight += colGap + columnWidths[i];
            drawText(stats.tracks[track.id]?.[def.id] ?? '', colRight, mid, valueFont, '#ffffff', 'right');
          });
          y += layout.rowHeight;
        });

        // Footer rows
        if (footerItems.length > 0) {
          y += layout.titleGap;
          footerItems.forEach(item => {
            const mid = y + layout.rowHeight / 2;
            drawText(item.caption, left, mid, captionFont, '#999', 'left', true);
            drawText(pairName, left + measure(item.caption, captionFont, true) + captionGap, mid, itemFont, '#ffffff');
            drawText(item.value, right, mid, valueFont, '#ffffff', 'right');
            y += layout.rowHeight;
          });
        }
        ctx.restore();
        return { x: x0, y: y0, width: panelWidth, height: panelHeight };
      };

      // ---- Leaderboard (see DEFAULT_FINISH_RADIUS) ----

      // Per track: index of its finish arrival - the first point inside the
      // finish radius after having been outside it (so a start at the finish
      // doesn't count), searching from where the track is at the stats start
      const finishArrivals = useMemo(() => {
        const arrivals = new Map();
        if (!finishPoint) return arrivals;
        const target = { lat: finishPoint.lat, lon: finishPoint.lng };
        effectiveTracks.forEach(track => {
          const startHead = getHeadState(track, statsStartProgress);
          let from = startHead ? startHead.index : 0;
          if (alignmentActive) {
            const match = alignmentMatches[track.id];
            if (!match) return;
            from = Math.max(from, match.index);
          }
          let wasOutside = false;
          for (let i = from; i < track.points.length; i++) {
            const inside = getDistance(track.points[i], target) * 1000 <= finishRadius;
            if (!inside) {
              wasOutside = true;
            } else if (wasOutside) {
              arrivals.set(track.id, i);
              break;
            }
          }
        });
        return arrivals;
      }, [effectiveTracks, finishPoint, finishRadius, statsStartProgress, alignmentActive, alignmentMatches, alignedTiming, animationStyle, simultaneousSpan]);

      // The race clock (same as the scoreboard timer, before the stats-start
      // offset) at a given timestamp of a track, or null without a clock
      const getRaceClockAtTrackTime = (track, timeMs) => {
        if (isNaN(timeMs)) return null;
        if (alignmentActive) {
          const match = alignmentMatches[track.id];
          const alignTime = match ? track.timesMs[match.index] : NaN;
          return alignedTiming.spanMs > 0 && !isNaN(alignTime) ? timeMs - alignTime : null;
        }
        if (animationStyle === 'simultaneous' && simultaneousSpan) return timeMs - simultaneousSpan.earliestStart;
        return null;
      };

      // Leaderboard rows at a progress, in rank order: finished tracks first (by
      // finish time), then by straight-line distance to go; not-yet-started last.
      // Racing tracks show their gap to the leader (e.g. "-0.50 mi"); the leader
      // shows a dash (or its finish time if it has finished).
      // Rank order at a progress (rows with group/key, sorted); shared by the
      // leaderboard and its position-change slide
      const rankLeaderboardRows = (progressPercent) => {
        const target = { lat: finishPoint.lat, lon: finishPoint.lng };
        const clockStart = getRaceClockMs(statsStartProgress);
        const rows = effectiveTracks.map((track, order) => {
          const head = getHeadState(track, progressPercent);
          const arrival = finishArrivals.get(track.id);
          if (head && arrival !== undefined && head.index >= arrival) {
            const clock = getRaceClockAtTrackTime(track, track.timesMs[arrival]);
            const elapsed = clock !== null && clockStart !== null ? clock - clockStart : null;
            return { track, order, group: 0, key: elapsed !== null ? elapsed : arrival, text: elapsed !== null ? `\u2691 ${formatRaceTime(elapsed)}` : '\u2691', finished: true };
          }
          if (!head) return { track, order, group: 2, key: 0, text: '\u2014', finished: false };
          const meters = getDistance(getHeadPoint(track, head), target) * 1000;
          return { track, order, group: 1, key: meters, text: '', finished: false };
        });
        return rows.sort((a, b) => a.group - b.group || a.key - b.key || a.order - b.order);
      };

      const computeLeaderboard = (progressPercent) => {
        if (!finishPoint || effectiveTracks.length === 0) return [];
        const target = { lat: finishPoint.lat, lon: finishPoint.lng };
        const rows = rankLeaderboardRows(progressPercent);
        rows.forEach((row, i) => { row.slot = i; row.moved = 0; });

        // Position changes: when the order differs from RANK_SLIDE_SECONDS ago,
        // find when it changed (binary search) and slide each moved row from its
        // old place to its new one; `moved` fades from 1 to 0 over the slide
        // (sign: + moved up, - moved down) for the highlight
        if (animateRankChanges && progressPercent > 0) {
          const windowPct = (RANK_SLIDE_SECONDS / exportDuration) * 100;
          const orderKey = (p) => rankLeaderboardRows(p).map(r => r.track.id).join('|');
          let lo = Math.max(0, progressPercent - windowPct);
          let hi = progressPercent;
          const oldKey = orderKey(lo);
          if (oldKey !== rows.map(r => r.track.id).join('|')) {
            for (let k = 0; k < 12; k++) {
              const mid = (lo + hi) / 2;
              if (orderKey(mid) === oldKey) lo = mid; else hi = mid;
            }
            const frac = Math.min(1, (progressPercent - hi) / windowPct);
            const eased = frac * frac * (3 - 2 * frac); // smoothstep
            const oldIndex = new Map(oldKey.split('|').map((id, i) => [id, i]));
            rows.forEach((row, i) => {
              const from = oldIndex.get(String(row.track.id));
              if (from === undefined || from === i) return;
              row.slot = from + (i - from) * eased;
              row.moved = Math.sign(from - i) * (1 - frac);
            });
          }
        }

        // Gap to the leader, measured in distance to go (a finished leader has 0 to go)
        const leader = rows[0];
        const leaderToGo = leader.group === 0 ? 0 : leader.key;
        rows.forEach((row, i) => {
          if (row.group !== 1) return;
          if (i === 0) {
            row.text = '\u2014';
            return;
          }
          const gap = row.key - leaderToGo;
          row.text = gap * STAT_UNITS[statsUnits].mToShort < 0.5
            ? `0 ${STAT_UNITS[statsUnits].short}`
            : `-${formatShortDistance(gap, statsUnits)}`;
        });

        // Gap trend: change of each racing track's gap to the current leader over
        // the last GAP_TREND_WINDOW_MS of race time (needs a race clock; not shown
        // once the leader has finished - the gap is then just distance to go)
        const raceSpanMs = alignmentActive
          ? alignedTiming.spanMs
          : (animationStyle === 'simultaneous' && simultaneousSpan ? simultaneousSpan.spanMs : 0);
        if (showGapTrend && raceSpanMs > 0 && leader.group === 1) {
          const earlier = Math.max(0, progressPercent - (GAP_TREND_WINDOW_MS / raceSpanMs) * 100);
          const seconds = ((progressPercent - earlier) / 100) * raceSpanMs / 1000;
          const toGoAt = (track, p) => {
            const h = getHeadState(track, p);
            return h ? getDistance(getHeadPoint(track, h), target) * 1000 : null;
          };
          const leaderThen = seconds >= 5 ? toGoAt(leader.track, earlier) : null;
          if (leaderThen !== null) {
            rows.forEach((row, i) => {
              if (i === 0 || row.group !== 1) return;
              const mineThen = toGoAt(row.track, earlier);
              if (mineThen === null) return;
              const rate = ((row.key - leader.key) - (mineThen - leaderThen)) / seconds; // m/s, + = falling behind
              const level = GAP_TREND_THRESHOLDS.filter(t => Math.abs(rate) >= t).length;
              row.trend = level === 0 ? 0 : Math.sign(rate) * level;
            });
          }
        }
        return rows;
      };

      // Draw the leaderboard panel (preview overlay and captureFrame). `avoid` is
      // the scoreboard's panel when it sits in the same corner - the leaderboard
      // stacks next to it. Returns the panel bounds, or null if nothing to draw.
      const drawLeaderboard = (ctx, frameWidth, frameHeight, scale, progressPercent, { avoid = null, bottomReserve = 0 } = {}) => {
        const rows = computeLeaderboard(progressPercent);
        if (rows.length === 0) return null;
        const layout = getLegendLayout(leaderboardSize, scale);
        const font = leaderboardFont;
        const itemFont = `${layout.itemFont}px ${font}`;
        const valueFont = `600 ${layout.itemFont}px ${font}`;
        const captionFont = `600 ${layout.titleFont}px ${font}`;
        const colGap = layout.barGap * 1.6;
        const supportsLetterSpacing = 'letterSpacing' in ctx;

        ctx.save();
        const measure = (text, f, spaced = false) => {
          ctx.font = f;
          if (supportsLetterSpacing) ctx.letterSpacing = spaced ? `${layout.titleLetterSpacing}px` : '0px';
          const w = ctx.measureText(text).width + (spaced && !supportsLetterSpacing ? text.length * layout.titleLetterSpacing : 0);
          if (supportsLetterSpacing) ctx.letterSpacing = '0px';
          return w;
        };
        const drawText = (text, x, y, f, color, align = 'left', spaced = false) => {
          ctx.font = f;
          ctx.fillStyle = color;
          ctx.textAlign = align;
          if (supportsLetterSpacing) ctx.letterSpacing = spaced ? `${layout.titleLetterSpacing}px` : '0px';
          ctx.fillText(text, x, y);
          if (supportsLetterSpacing) ctx.letterSpacing = '0px';
        };

        const rankWidth = measure(`${rows.length}.`, valueFont);
        const nameWidth = Math.max(...rows.map(r => measure(r.track.label, itemFont)));
        // Fixed-width value column (templates) so the panel doesn't resize every frame
        const valueWidth = Math.max(
          measure(`-0.00 ${STAT_UNITS[statsUnits].distance}`, valueFont),
          measure(`-999 ${STAT_UNITS[statsUnits].short}`, valueFont),
          ...rows.map(r => measure(r.text, valueFont))
        );
        const headerWidth = measure('LEADERBOARD', captionFont, true);
        // Trend arrow column (fixed width whenever arrows are enabled, so the panel doesn't jump)
        const arrowSize = layout.rowHeight * 0.8;
        const arrowColWidth = showGapTrend ? layout.barGap * 0.8 + arrowSize * 0.75 : 0;
        const rowWidth = rankWidth + layout.barGap + layout.barWidth + layout.barGap + nameWidth + colGap + valueWidth + arrowColWidth;
        const panelWidth = 2 * layout.pad + Math.max(headerWidth, rowWidth);
        const panelHeight = 2 * layout.pad + layout.titleHeight + layout.titleGap + rows.length * layout.rowHeight;

        const isRight = leaderboardPosition === 'top-right' || leaderboardPosition === 'bottom-right';
        const isTop = leaderboardPosition === 'top-left' || leaderboardPosition === 'top-right';
        const x0 = isRight ? frameWidth - panelWidth - layout.margin : layout.margin;
        let y0;
        if (isTop) {
          y0 = avoid ? avoid.y + avoid.height + layout.margin / 2 : layout.margin;
        } else {
          const bottomMargin = isRight ? Math.max(layout.margin, bottomReserve) : layout.margin;
          y0 = avoid ? avoid.y - panelHeight - layout.margin / 2 : frameHeight - panelHeight - bottomMargin;
        }

        ctx.fillStyle = 'rgba(45, 45, 45, 0.95)';
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(x0, y0, panelWidth, panelHeight, layout.radius);
        } else {
          ctx.rect(x0, y0, panelWidth, panelHeight);
        }
        ctx.fill();
        ctx.textBaseline = 'middle';

        const left = x0 + layout.pad;
        const right = x0 + panelWidth - layout.pad;
        let y = y0 + layout.pad;
        drawText('LEADERBOARD', left, y + layout.titleHeight / 2, captionFont, '#999', 'left', true);
        y += layout.titleHeight + layout.titleGap;

        // Rank numbers stay in place; the rows themselves slide on position changes
        rows.forEach((row, i) => {
          drawText(`${i + 1}.`, left + rankWidth, y + (i + 0.5) * layout.rowHeight, valueFont, '#999', 'right');
        });
        const barX = left + rankWidth + layout.barGap;
        // Draw order: still rows, then rows moving down, then rows moving up - the
        // overtaking track passes over the one it overtakes
        const drawOrder = (row) => (row.moved === 0 ? -2 : row.moved);
        [...rows].sort((a, b) => drawOrder(a) - drawOrder(b)).forEach(row => {
          const mid = y + (row.slot + 0.5) * layout.rowHeight;
          if (row.moved) {
            // Solid row background (so overlapping rows don't show through each
            // other mid-swap) plus a fading highlight: green moving up, red down
            const hx = barX - layout.barGap * 0.5;
            const hw = right - hx + layout.barGap * 0.5;
            const rowRect = () => {
              ctx.beginPath();
              if (typeof ctx.roundRect === 'function') {
                ctx.roundRect(hx, mid - layout.rowHeight / 2, hw, layout.rowHeight, layout.radius / 2);
              } else {
                ctx.rect(hx, mid - layout.rowHeight / 2, hw, layout.rowHeight);
              }
            };
            ctx.fillStyle = '#2d2d2d';
            rowRect();
            ctx.fill();
            ctx.globalAlpha = 0.55 * Math.abs(row.moved);
            ctx.fillStyle = row.moved > 0 ? '#3ddc84' : '#ff4d4d';
            rowRect();
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          ctx.fillStyle = row.track.color;
          ctx.fillRect(barX, mid - layout.barHeight / 2, layout.barWidth, layout.barHeight);
          drawText(row.track.label, barX + layout.barWidth + layout.barGap, mid, itemFont, '#ffffff');
          drawText(row.text, right - arrowColWidth, mid, valueFont, row.finished ? '#ffd54a' : '#ffffff', 'right');
          if (row.trend) drawTrendArrow(ctx, right - arrowSize * 0.375, mid, arrowSize, row.trend);
        });
        ctx.restore();
        return { x: x0, y: y0, width: panelWidth, height: panelHeight };
      };

      // Redraw the preview scoreboard and leaderboard overlays after every render.
      // They live on the reference-size surface (drawn at scale 1, CSS-scaled with
      // the map). Each panel is drawn on an off-screen surface-size canvas and only
      // its bounds are copied into its visible canvas, sized and positioned to the
      // panel - a full-surface visible canvas changing every frame was expensive
      // to composite on phones.
      const scoreboardCanvasRef = useRef(null);
      const leaderboardCanvasRef = useRef(null);
      const panelScratchRef = useRef(null);
      useEffect(() => {
        const panels = [scoreboardCanvasRef.current, leaderboardCanvasRef.current];
        const hideAll = () => panels.forEach(canvas => { if (canvas) canvas.style.display = 'none'; });
        if (isRendering || effectiveTracks.length === 0 || !surfaceSize) return hideAll();

        let scratch = panelScratchRef.current;
        if (!scratch) scratch = panelScratchRef.current = document.createElement('canvas');
        if (scratch.width !== surfaceSize.width || scratch.height !== surfaceSize.height) {
          scratch.width = surfaceSize.width;
          scratch.height = surfaceSize.height;
        }
        const scratchCtx = scratch.getContext('2d');

        // Copy a panel's area of the scratch canvas into its visible canvas
        const blit = (canvas, bounds) => {
          if (!canvas) return;
          if (!bounds) {
            canvas.style.display = 'none';
            return;
          }
          const x = Math.max(0, Math.floor(bounds.x));
          const y = Math.max(0, Math.floor(bounds.y));
          const w = Math.min(scratch.width - x, Math.ceil(bounds.x + bounds.width) - x);
          const h = Math.min(scratch.height - y, Math.ceil(bounds.y + bounds.height) - y);
          if (w <= 0 || h <= 0) {
            canvas.style.display = 'none';
            return;
          }
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          } else {
            canvas.getContext('2d').clearRect(0, 0, w, h);
          }
          canvas.getContext('2d').drawImage(scratch, x, y, w, h, 0, 0, w, h);
          canvas.style.left = `${x}px`;
          canvas.style.top = `${y}px`;
          canvas.style.width = `${w}px`;
          canvas.style.height = `${h}px`;
          canvas.style.display = 'block';
        };

        scratchCtx.clearRect(0, 0, scratch.width, scratch.height);
        const scoreboardBounds = showLegend
          ? drawScoreboard(scratchCtx, scratch.width, scratch.height, 1, progress, bottomRightReserve)
          : null;
        blit(scoreboardCanvasRef.current, scoreboardBounds);

        scratchCtx.clearRect(0, 0, scratch.width, scratch.height);
        const leaderboardBounds = showLeaderboard && finishPoint
          ? drawLeaderboard(scratchCtx, scratch.width, scratch.height, 1, progress, {
              avoid: leaderboardPosition === legendPosition ? scoreboardBounds : null,
              bottomReserve: bottomRightReserve
            })
          : null;
        blit(leaderboardCanvasRef.current, leaderboardBounds);
      });

      const animate = (timestamp) => {
        if (!isPlayingRef.current || tracks.length === 0) {
          return;
        }

        if (!lastTimestampRef.current) {
          lastTimestampRef.current = timestamp;
        }

        const deltaTime = timestamp - lastTimestampRef.current;
        lastTimestampRef.current = timestamp;

        // Preview pacing matches the exported video exactly: the full animation
        // takes exportDuration seconds (which is derived from playback speed)
        const progressIncrement = (deltaTime / (exportDuration * 1000)) * 100;

        setProgress(prev => {
          const newProgress = prev + progressIncrement;
          if (newProgress >= 100) {
            setIsPlaying(false);
            isPlayingRef.current = false;
            lastTimestampRef.current = null;
            return 100;
          }
          return newProgress;
        });

        if (isPlayingRef.current) {
          animationFrameRef.current = requestAnimationFrame(animate);
        }
      };

      useEffect(() => {
        isPlayingRef.current = isPlaying;

        if (isPlaying) {
          lastTimestampRef.current = null; // Reset timestamp when starting
          animationFrameRef.current = requestAnimationFrame(animate);
        } else {
          if (animationFrameRef.current) {
            cancelAnimationFrame(animationFrameRef.current);
          }
          lastTimestampRef.current = null;
        }
      }, [isPlaying, exportDuration]);

      // On page load: open what the URL asks for (?project= / ?gpx=, see
      // parseStartupLinks), otherwise preload the bundled example tracks so
      // first-time visitors see the app working. Examples are cleared as soon
      // as the user loads their own tracks.
      useEffect(() => {
        let cancelled = false;
        const links = parseStartupLinks(window.location.search);

        (async () => {
          if (links.project || links.gpx.length > 0) {
            const failures = [];
            if (links.project) {
              try {
                const project = JSON.parse(await fetchText(links.project, MAX_PROJECT_FILE_SIZE));
                if (!cancelled) applyProject(project, { confirmReplace: false });
              } catch (err) {
                failures.push(`${links.project}: ${err instanceof SyntaxError ? 'not a valid JSON file' : err.message}`);
              }
            }
            const results = await Promise.allSettled(links.gpx.map(entry => fetchGpxTrack(entry.url)));
            if (cancelled) return;
            const loaded = [];
            results.forEach((result, i) => {
              const entry = links.gpx[i];
              if (result.status === 'fulfilled') {
                const track = result.value;
                if (entry.label) track.label = entry.label;
                if (entry.color) track.color = entry.color;
                loaded.push(track);
              } else {
                failures.push(`${entry.url}: ${result.reason.message}`);
              }
            });
            addLoadedTracks(loaded, { title: links.title });
            if (loaded.length === 0 && links.title) setVideoTitle(links.title);
            if (failures.length > 0) {
              alert(`Some files from the link couldn't be loaded:\n\n${failures.join('\n')}`);
            }
            return;
          }

          const exampleFiles = ['examples/Kai.gpx', 'examples/Kimo.gpx'];
          const loaded = [];
          for (const path of exampleFiles) {
            try {
              const track = await fetchGpxTrack(path);
              track.isExample = true;
              loaded.push(track);
            } catch (e) {
              // Examples unavailable (offline, file://) - just start empty
            }
          }

          if (cancelled || loaded.length === 0) return;
          setTracks(prev => {
            if (prev.length > 0) return prev; // never clobber user uploads
            setFinishPoint(point => point || EXAMPLE_FINISH_POINT); // example race's finish (leaderboard)
            return loaded;
          });
          fitMapToTracks(loaded);
        })();

        return () => { cancelled = true; };
      }, []);

      // Warn before leaving the page while a video export is in progress
      useEffect(() => {
        if (!isRendering) return;
        const handler = (e) => {
          e.preventDefault();
          e.returnValue = '';
        };
        window.addEventListener('beforeunload', handler);
        return () => window.removeEventListener('beforeunload', handler);
      }, [isRendering]);

      // Common-point picking: while active, clicking the map sets the point
      useEffect(() => {
        if (!isPickingPoint || !mapInstanceRef.current) return;
        const map = mapInstanceRef.current;
        map.getContainer().classList.add('picking-point');
        const onMapClick = (e) => {
          setAlignPoint({ lat: e.latlng.lat, lng: e.latlng.lng });
          setIsPickingPoint(false);
        };
        map.on('click', onMapClick);
        return () => {
          map.off('click', onMapClick);
          map.getContainer().classList.remove('picking-point');
        };
      }, [isPickingPoint]);

      // Finish-point picking (Leaderboard): while active, clicking the map sets it
      useEffect(() => {
        if (!isPickingFinish || !mapInstanceRef.current) return;
        const map = mapInstanceRef.current;
        map.getContainer().classList.add('picking-point');
        const onMapClick = (e) => {
          setFinishPoint({ lat: e.latlng.lat, lng: e.latlng.lng });
          setIsPickingFinish(false);
        };
        map.on('click', onMapClick);
        return () => {
          map.off('click', onMapClick);
          map.getContainer().classList.remove('picking-point');
        };
      }, [isPickingFinish]);

      // Finish flag (preview marker; exports draw it in captureFrame) and the
      // finish-radius circle (preview only, removed while rendering video)
      const finishLayersRef = useRef([]);
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;
        finishLayersRef.current.forEach(layer => map.removeLayer(layer));
        finishLayersRef.current = [];
        if (!finishPoint || isRendering) return;

        if (showLeaderboard || isPickingFinish) {
          finishLayersRef.current.push(L.circle([finishPoint.lat, finishPoint.lng], {
            radius: finishRadius,
            color: '#ffffff',
            weight: 1.5 * renderScale,
            opacity: 0.8,
            dashArray: `${4 * renderScale} ${4 * renderScale}`,
            fill: false,
            interactive: false
          }).addTo(map));
        }
        if (showFinishFlag) {
          // Render the same flag the export draws into a small image
          const size = FINISH_FLAG_SIZE * renderScale;
          const pad = Math.ceil(size * 0.1);
          const canvas = document.createElement('canvas');
          canvas.width = Math.ceil(size * 0.9) + 2 * pad;
          canvas.height = Math.ceil(size) + 2 * pad;
          drawFinishFlag(canvas.getContext('2d'), pad + size * 0.04, pad + size, size);
          finishLayersRef.current.push(L.marker([finishPoint.lat, finishPoint.lng], {
            icon: L.icon({
              iconUrl: canvas.toDataURL(),
              iconSize: [canvas.width, canvas.height],
              iconAnchor: [pad + size * 0.04, pad + size]
            }),
            interactive: false,
            keyboard: false
          }).addTo(map));
        }
      }, [finishPoint, finishRadius, showFinishFlag, showLeaderboard, isPickingFinish, isRendering, renderScale]);

      // Draw the common-point circle and per-track match markers.
      // Removed while rendering video: with preferCanvas these layers would
      // otherwise be baked into the exported frames.
      const alignLayersRef = useRef([]);
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;
        alignLayersRef.current.forEach(layer => map.removeLayer(layer));
        alignLayersRef.current = [];
        if (!alignPoint || isRendering) return;

        const circle = L.circle([alignPoint.lat, alignPoint.lng], {
          radius: alignRadius,
          color: '#fc4c02',
          weight: 2,
          dashArray: '6 6',
          fillColor: '#fc4c02',
          fillOpacity: 0.08
        }).addTo(map);
        alignLayersRef.current.push(circle);

        effectiveTracks.forEach(track => {
          const match = alignmentMatches[track.id];
          if (!match) return;
          const p = track.points[match.index];
          const marker = L.circleMarker([p.lat, p.lon], {
            radius: 9,
            color: track.color,
            weight: 3,
            fill: false
          }).addTo(map);
          alignLayersRef.current.push(marker);
        });
      }, [alignPoint, alignRadius, alignmentMatches, effectiveTracks, isRendering]);

      const alignedMatchCount = effectiveTracks.filter(t => alignmentMatches[t.id]).length;

      const applyAlignment = () => {
        setAlignmentActive(true);
        setIsPlaying(false);
        setProgress(0);
      };

      const clearAlignment = () => {
        setAlignmentActive(false);
        setIsPickingPoint(false);
        setAlignPoint(null);
        setProgress(0);
      };

      // Store original bounds when tracks change
      useEffect(() => {
        if (tracks.length > 0 && mapInstanceRef.current) {
          const allPoints = [];
          effectiveTracks.forEach(track => {
            allPoints.push(...track.points.map(p => [p.lat, p.lon]));
          });
          if (allPoints.length > 0) {
            originalBoundsRef.current = L.latLngBounds(allPoints);
          }
        }
      }, [effectiveTracks]);

      // Track layers on the map. They are created once and then only moved each
      // frame (setLatLngs / setLatLng): rebuilding every layer on every frame
      // re-projected ~10k points per frame and starved slow phones of the time
      // needed to load and paint map tiles.

      // Full-track previews: rebuilt only when tracks or preview visibility change
      useEffect(() => {
        const map = mapInstanceRef.current;
        previewLayersRef.current.forEach(layer => map && map.removeLayer(layer));
        previewLayersRef.current = [];
        if (!map) return;

        // Not needed while exporting (drawTracksDirect draws the video's tracks),
        // and repainting them every frame slowed exports on phones
        if (exportScale !== null) return;

        // While picking/configuring the common point, always show full previews
        // so the user can see the overlaid tracks to click on
        const forcePreview = isPickingPoint || isPickingFinish || (alignPoint && !alignmentActive);
        if (!showAllTracks && !forcePreview) return;

        effectiveTracks.forEach(track => {
          const preview = L.polyline(
            track.points.map(p => [p.lat, p.lon]),
            { color: track.color, weight: 2 * renderScale, opacity: 0.3 }
          ).addTo(map);
          preview.bringToBack(); // keep previews under the animated lines and markers
          previewLayersRef.current.push(preview);
        });
      }, [effectiveTracks, showAllTracks, isPickingPoint, isPickingFinish, alignPoint, alignmentActive, renderScale, exportScale]);

      // Animated line, position marker, and label per track: moved every frame,
      // recreated only when their style (color, scale, label text/font) changes
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;
        const layersByTrack = animatedLayersRef.current;
        const removeEntry = (entry) => {
          ['line', 'marker', 'label'].forEach(key => entry[key] && map.removeLayer(entry[key]));
        };
        const visibleIds = new Set();

        effectiveTracks.forEach(track => {
          const visiblePoints = getVisiblePoints(track, progress);
          let entry = layersByTrack.get(track.id);
          if (visiblePoints.length === 0) {
            if (entry) {
              removeEntry(entry);
              layersByTrack.delete(track.id);
            }
            return;
          }
          visibleIds.add(track.id);
          const latlngs = visiblePoints.map(p => [p.lat, p.lon]);
          const head = latlngs[latlngs.length - 1];
          if (!entry) {
            entry = {};
            layersByTrack.set(track.id, entry);
          }

          if (exportScale !== null) {
            // Exporting: drawTracksDirect draws lines and markers; keep only the label
            if (entry.line) map.removeLayer(entry.line);
            if (entry.marker) map.removeLayer(entry.marker);
            entry.line = entry.marker = null;
            entry.styleKey = null;
          } else {
            const styleKey = `${track.color}|${renderScale}`;
            if (entry.styleKey !== styleKey) {
              if (entry.line) map.removeLayer(entry.line);
              if (entry.marker) map.removeLayer(entry.marker);
              entry.line = L.polyline(latlngs, { color: track.color, weight: 4 * renderScale, opacity: 0.9 }).addTo(map);
              entry.marker = L.circleMarker(head, {
                radius: 6 * renderScale,
                fillColor: track.color,
                color: '#fff',
                weight: 2 * renderScale,
                opacity: 1,
                fillOpacity: 1
              }).addTo(map);
              entry.styleKey = styleKey;
            } else {
              entry.line.setLatLngs(latlngs);
              entry.marker.setLatLng(head);
            }
          }

          // Label that follows the current position
          const labelKey = track.label && showLabels
            ? `${track.label}|${track.color}|${labelFont}|${labelSize}|${renderScale}`
            : null;
          if (entry.labelKey !== labelKey) {
            if (entry.label) map.removeLayer(entry.label);
            entry.label = labelKey
              ? L.marker(head, {
                  icon: L.divIcon({
                    className: 'map-label',
                    html: `<div class="map-label" style="color: ${escapeHtml(track.color)}; font-size: ${labelSize * renderScale}px; font-family: ${escapeHtml(labelFont)}, sans-serif">${escapeHtml(track.label)}</div>`,
                    iconSize: null,
                    iconAnchor: [-15 * renderScale, 10 * renderScale]
                  })
                }).addTo(map)
              : null;
            entry.labelKey = labelKey;
          } else if (entry.label) {
            entry.label.setLatLng(head);
          }
        });

        // Drop layers of tracks that were removed or aren't visible now
        for (const [id, entry] of layersByTrack) {
          if (!visibleIds.has(id)) {
            removeEntry(entry);
            layersByTrack.delete(id);
          }
        }
      }, [effectiveTracks, progress, showLabels, labelFont, labelSize, animationStyle, alignmentActive, alignmentMatches, renderScale, exportScale]);

      // Center of the followed track(s) at the given progress, or null if none visible yet.
      // Shared by the preview zoom-follow effect and renderExportFrame.
      const getFollowCenter = (progressPercent) => {
        const tracksToFollow = centeredTrackId
          ? effectiveTracks.filter(t => t.id == centeredTrackId) // Use == to handle string/number comparison
          : effectiveTracks;
        const positions = [];
        tracksToFollow.forEach((track) => {
          const visiblePoints = getVisiblePoints(track, progressPercent);
          if (visiblePoints.length > 0) {
            const lastPoint = visiblePoints[visiblePoints.length - 1];
            positions.push([lastPoint.lat, lastPoint.lon]);
          }
        });
        if (positions.length === 0) return null;
        return [
          positions.reduce((sum, pos) => sum + pos[0], 0) / positions.length,
          positions.reduce((sum, pos) => sum + pos[1], 0) / positions.length
        ];
      };

      // ---- Tile prefetch ----
      // Leaflet only requests a tile once it is on screen, so with the follow
      // camera the leading edge of the view (ahead of the tracks) was always
      // still downloading - a visible moving band on slower mobile connections.
      // We know where the camera is going, so download the tiles for the next
      // few seconds of views in the background; the browser cache (tiles are
      // cacheable for a day) then serves them instantly when they come into view.
      const prefetchRef = useRef({ started: new Set(), queue: [], inFlight: 0 });

      const pumpTilePrefetch = () => {
        const state = prefetchRef.current;
        while (state.inFlight < PREFETCH_MAX_IN_FLIGHT && state.queue.length > 0) {
          const url = state.queue.shift();
          if (state.started.has(url)) continue;
          state.started.add(url);
          state.inFlight++;
          const img = new Image();
          img.crossOrigin = 'anonymous'; // same CORS mode as the tile layer, so the cache entry is reused
          img.onload = img.onerror = () => {
            state.inFlight--;
            pumpTilePrefetch();
          };
          img.src = url;
        }
      };

      // Tile URLs covering a view of width x height px centered at `center` at `zoom`
      const getTileUrlsForView = (center, zoom, width, height) => {
        const map = mapInstanceRef.current;
        const source = MAP_IMAGERY[mapImagery] || MAP_IMAGERY.clarity;
        const tileZoom = Math.min(Math.round(zoom), source.maxNativeZoom);
        const overzoom = 2 ** (zoom - tileZoom); // tiles are drawn bigger beyond the native level
        const p = map.project(center, tileZoom);
        const halfW = width / 2 / overzoom;
        const halfH = height / 2 / overzoom;
        const n = 2 ** tileZoom;
        const urls = [];
