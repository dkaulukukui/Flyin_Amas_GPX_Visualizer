      }), [tracks, trackSmoothing]);

      // For each track, the point matched inside the common-point circle (or null if none)
      const alignmentMatches = useMemo(() => {
        const result = {};
        if (!alignPoint) return result;
        effectiveTracks.forEach(track => {
          let best = null;
          track.points.forEach((p, index) => {
            const distanceM = getDistance(p, { lat: alignPoint.lat, lon: alignPoint.lng }) * 1000;
            if (distanceM > alignRadius) return;
            if (alignMethod === 'closest') {
              if (!best || distanceM < best.distanceM) best = { index, distanceM };
            } else if (alignMethod === 'earliest') {
              if (!best) best = { index, distanceM }; // first pass through the circle
            } else {
              best = { index, distanceM }; // 'latest': last pass through the circle
            }
          });
          result[track.id] = best;
        });
        return result;
      }, [effectiveTracks, alignPoint, alignRadius, alignMethod]);

      // Race timing for aligned mode: longest remaining time (and point count)
      // among matched tracks, measured from each track's own crossing
      const alignedTiming = useMemo(() => {
        let spanMs = 0;
        let maxRemainingPoints = 0;
        effectiveTracks.forEach(track => {
          const match = alignmentMatches[track.id];
          if (!match) return;
          maxRemainingPoints = Math.max(maxRemainingPoints, track.points.length - 1 - match.index);
          const alignTime = track.timesMs[match.index];
          if (!isNaN(alignTime) && track.endTime) {
            spanMs = Math.max(spanMs, track.endTime.getTime() - alignTime);
          }
        });
        return { spanMs, maxRemainingPoints };
      }, [effectiveTracks, alignmentMatches]);

      // Absolute time span of all timestamped tracks (simultaneous mode clock)
      const simultaneousSpan = useMemo(() => {
        const tracksWithTime = effectiveTracks.filter(t => t.startTime && t.endTime);
        if (tracksWithTime.length === 0) return null;
        const earliestStart = Math.min(...tracksWithTime.map(t => t.startTime.getTime()));
        const latestEnd = Math.max(...tracksWithTime.map(t => t.endTime.getTime()));
        return { earliestStart, spanMs: latestEnd - earliestStart };
      }, [effectiveTracks]);

      // Where a track's moving head is at the given progress: the visible points
      // are points[from..index], plus a head `frac` (0..1) of the way to
      // points[index + 1]. Returns null while the track isn't visible.
      // Single source of truth for browser playback, zoom-follow, both video
      // export paths (via getVisiblePoints), and the scoreboard stats.
      //
      // The interpolated head lets the line, marker, label, and follow camera
      // glide continuously instead of stepping a whole GPS fix at a time
      // (which made motion jumpy, especially when zoomed in).
      const getHeadState = (track, progressPercent) => {
        const { points, timesMs } = track;
        if (points.length === 0) return null;

        // Time-based position: last fix at or before `targetMs` (scanning from
        // `from`, skipping untimed fixes), plus the fraction toward the next fix
        const headAtTime = (from, targetMs) => {
          let lastIndex = from;
          for (let i = from + 1; i < points.length; i++) {
            const t = timesMs[i];
            if (isNaN(t)) continue;
            if (t > targetMs) {
              // Interpolate only between adjacent fixes; a gap of untimed
              // points would otherwise be cut across
              const lastT = timesMs[lastIndex];
              const frac = (i === lastIndex + 1 && !isNaN(lastT) && t > lastT)
                ? (targetMs - lastT) / (t - lastT)
                : 0;
              return { from, index: lastIndex, frac };
            }
            lastIndex = i;
          }
          return { from, index: lastIndex, frac: 0 };
        };

        // Index-based position: `exactCount` fixes reached (fractional part
        // becomes the head), counted from `from`
        const headAtCount = (from, exactCount) => {
          const count = Math.floor(exactCount);
          if (!(count > 0)) return null;
          const index = Math.min(from + count - 1, points.length - 1);
          return { from, index, frac: index === from + count - 1 ? exactCount - count : 0 };
        };

        // Aligned mode: race all matched tracks from the common point using
        // real elapsed time from each track's own crossing
        if (alignmentActive) {
          const match = alignmentMatches[track.id];
          if (!match) return null; // no point within radius - excluded from the race
          const alignIdx = match.index;

          const alignPointTime = timesMs[alignIdx];
          if (alignedTiming.spanMs > 0 && !isNaN(alignPointTime)) {
            const tau = (progressPercent / 100) * alignedTiming.spanMs;
            return headAtTime(alignIdx, alignPointTime + tau);
          }

          // No usable timestamps - pace by point index instead (the align
          // point itself is always shown, hence the +1)
          return headAtCount(alignIdx, (progressPercent / 100) * alignedTiming.maxRemainingPoints + 1);
        }

        if (animationStyle === 'sequential') {
          const trackIndex = effectiveTracks.findIndex(t => t.id === track.id);
          const tracksBeforeThis = effectiveTracks.slice(0, trackIndex);
          const totalPointsBefore = tracksBeforeThis.reduce((sum, t) => sum + t.points.length, 0);
          const totalPoints = effectiveTracks.reduce((sum, t) => sum + t.points.length, 0);
          const exactTotalPoint = (progressPercent / 100) * totalPoints;
          return headAtCount(0, Math.min(exactTotalPoint - totalPointsBefore, points.length));
        }

        // Simultaneous - use absolute time-based synchronization if available
        if (track.duration && track.startTime && simultaneousSpan) {
          const currentAbsoluteTime = simultaneousSpan.earliestStart + (progressPercent / 100) * simultaneousSpan.spanMs;
          if (currentAbsoluteTime < track.startTime.getTime()) {
            return null;
          }
          return headAtTime(0, currentAbsoluteTime);
        }

        // Fallback to percentage-based if no time data
        return headAtCount(0, (progressPercent / 100) * points.length);
      };

      // Interpolated head position ({lat, lon}) for a head state
      const getHeadPoint = (track, head) => {
        const { points } = track;
        return head.frac > 0 && head.index + 1 < points.length
          ? lerpPoint(points[head.index], points[head.index + 1], Math.min(head.frac, 1))
          : points[head.index];
      };

      // Points of a track visible at the given progress; the last one is the
      // interpolated head (see getHeadState)
      const getVisiblePoints = (track, progressPercent) => {
        const head = getHeadState(track, progressPercent);
        if (!head) return [];
        const visible = track.points.slice(head.from, head.index + 1);
        if (head.frac > 0 && head.index + 1 < track.points.length) {
          visible.push(getHeadPoint(track, head));
        }
        return visible;
      };

      // ---- Scoreboard stats (see STAT_DEFINITIONS) ----

      // Point fields present in any track (gates stats with `requires`)
      const availableFields = useMemo(() => {
        const fields = new Set();
        effectiveTracks.forEach(track => track.points.forEach(p => {
          Object.keys(GPX_EXTENSION_FIELDS).forEach(key => { if (p[key] !== undefined) fields.add(key); });
        }));
        return fields;
      }, [effectiveTracks]);

      const isStatAvailable = (def) => {
        if (def.requires && !availableFields.has(def.requires)) return false;
        if (def.scope === 'pair' && effectiveTracks.length < 2) return false;
        return true;
      };

      const activeStats = STAT_DEFINITIONS.filter(def => statsEnabled[def.id] && isStatAvailable(def));

      // The two tracks compared by pair stats (defaults: first two tracks)
      const gapTracks = (() => {
        const find = (id) => effectiveTracks.find(t => t.id == id); // == handles string ids from <select>
        const a = find(statsGapIds[0]) || effectiveTracks[0];
        const b = find(statsGapIds[1]) || effectiveTracks.find(t => t !== a);
        return a && b && a !== b ? [a, b] : null;
      })();

      // Race clock (ms) at a progress: the animation mode's common timeline, or
      // null when there isn't one (sequential mode / tracks without timestamps)
      const getRaceClockMs = (progressPercent) => {
        if (alignmentActive) {
          return alignedTiming.spanMs > 0 ? (progressPercent / 100) * alignedTiming.spanMs : null;
        }
        if (animationStyle === 'simultaneous' && simultaneousSpan) {
          return (progressPercent / 100) * simultaneousSpan.spanMs;
        }
        return null;
      };

      // Value of a per-point array (timesMs, cumDistM) at an interpolated head
      const valueAtHead = (values, head) => {
        const a = values[head.index];
        const b = values[head.index + 1];
        return head.frac > 0 && Number.isFinite(b) ? a + (b - a) * head.frac : a;
      };

      // Average speed (m/s) over the last SPEED_WINDOW_MS of track time
      const getSpeedAtHead = (track, head) => {
        const { timesMs, cumDistM } = track;
        const tHead = valueAtHead(timesMs, head);
        if (isNaN(tHead)) return null;
        const tTarget = tHead - SPEED_WINDOW_MS;
        let j = head.index;
        while (j > 0 && !(timesMs[j] <= tTarget)) j--;
        let tPrev = timesMs[j];
        let dPrev = cumDistM[j];
        const tNext = timesMs[j + 1];
        if (tPrev <= tTarget && tNext > tTarget) {
          const f = (tTarget - tPrev) / (tNext - tPrev);
          dPrev += (cumDistM[j + 1] - cumDistM[j]) * f;
          tPrev = tTarget;
        }
        const dt = tHead - tPrev;
        if (!(dt >= 2000)) return null; // too little history for a stable reading
        return (valueAtHead(cumDistM, head) - dPrev) / (dt / 1000);
      };

      // Latest sensor reading (e.g. hr) at the head, tolerating a few dropped samples
      const getFieldAtHead = (track, head, key) => {
        for (let i = head.index; i >= Math.max(head.from, head.index - 10); i--) {
          const v = track.points[i][key];
          if (Number.isFinite(v)) return v;
        }
        return null;
      };

      // Formatted scoreboard values at a progress:
      // { race: {statId: text}, tracks: {trackId: {statId: text}}, pair: {statId: text} }
      const computeScoreboardStats = (progressPercent) => {
        const result = { race: {}, tracks: {}, pair: {} };
        if (activeStats.length === 0) return result;
        const beforeStart = progressPercent < statsStartProgress;
        const show = (def, value) => (value === null || value === undefined || !Number.isFinite(value)
          ? '\u2014'
          : def.format(value, statsUnits));

        const heads = new Map();
        effectiveTracks.forEach(track => heads.set(track.id, getHeadState(track, progressPercent)));

        const clockNow = getRaceClockMs(progressPercent);
        const clockStart = getRaceClockMs(statsStartProgress);
        const raceCtx = { elapsedMs: clockNow !== null && clockStart !== null ? clockNow - clockStart : null };

        effectiveTracks.forEach(track => {
          const head = heads.get(track.id);
          const trackCtx = {
            get distanceM() {
              if (!head) return null;
              if (beforeStart) return 0;
              const startHead = getHeadState(track, statsStartProgress);
              const startDist = startHead ? valueAtHead(track.cumDistM, startHead) : track.cumDistM[head.from];
              return Math.max(0, valueAtHead(track.cumDistM, head) - startDist);
            },
            speedMps: () => (head ? getSpeedAtHead(track, head) : null),
            field: (key) => (head ? getFieldAtHead(track, head, key) : null)
          };
          result.tracks[track.id] = {};
          activeStats.filter(d => d.scope === 'track').forEach(def => {
            result.tracks[track.id][def.id] = show(def, def.compute(trackCtx));
          });
        });

        let pairCtx = { distanceM: null };
        if (gapTracks) {
          const [a, b] = gapTracks;
          const headA = heads.get(a.id);
          const headB = heads.get(b.id);
          if (headA && headB) {
            pairCtx = { distanceM: getDistance(getHeadPoint(a, headA), getHeadPoint(b, headB)) * 1000 };
          }
        }

        activeStats.forEach(def => {
          if (def.scope === 'race') result.race[def.id] = show(def, def.compute(raceCtx));
          if (def.scope === 'pair') result.pair[def.id] = show(def, def.compute(pairCtx));
        });
        return result;
      };

      // Draw the legend / scoreboard. Shared by the preview overlay canvas and
      // captureFrame so both are identical. Sizes are reference px x `scale`;
      // `bottomReserve` keeps a bottom-right panel above the watermark.
      const drawScoreboard = (ctx, frameWidth, frameHeight, scale, progressPercent, bottomReserve) => {
        const rows = effectiveTracks;
        if (rows.length === 0) return;
        const layout = getLegendLayout(legendSize, scale);
        const stats = computeScoreboardStats(progressPercent);
        const raceDefs = activeStats.filter(d => d.scope === 'race');
        const trackDefs = activeStats.filter(d => d.scope === 'track');
        const pairDefs = gapTracks ? activeStats.filter(d => d.scope === 'pair') : [];
        const font = scoreboardFont;
        const itemFont = `${layout.itemFont}px ${font}`;
        const valueFont = `600 ${layout.itemFont}px ${font}`;
        const captionFont = `600 ${layout.titleFont}px ${font}`;
        const headerValueSize = layout.itemFont * 1.35;
        const headerValueFont = `700 ${headerValueSize}px ${font}`;
        const colGap = layout.barGap * 1.6;
        const captionGap = layout.barGap * 0.8;
        const supportsLetterSpacing = 'letterSpacing' in ctx;

        ctx.save();
        const measure = (text, f, spaced = false) => {
          ctx.font = f;
          if (supportsLetterSpacing) ctx.letterSpacing = spaced ? `${layout.titleLetterSpacing}px` : '0px';
          const w = ctx.measureText(text).width + (spaced && !supportsLetterSpacing ? text.length * layout.titleLetterSpacing : 0);
          if (supportsLetterSpacing) ctx.letterSpacing = '0px';
          return w;
        };
        const drawText = (text, x, y, f, color, align = 'left', spaced = false) => {
          ctx.font = f;
          ctx.fillStyle = color;
          ctx.textAlign = align;
          if (supportsLetterSpacing) ctx.letterSpacing = spaced ? `${layout.titleLetterSpacing}px` : '0px';
          ctx.fillText(text, x, y);
          if (supportsLetterSpacing) ctx.letterSpacing = '0px';
        };

        // Header: race stats (e.g. TIME 12:34), or the plain "TRACKS" caption
        const headerItems = raceDefs.map(def => ({
          caption: def.short || def.label.toUpperCase(),
          value: stats.race[def.id],
          width: Math.max(measure(def.template(statsUnits), headerValueFont), measure(stats.race[def.id], headerValueFont))
        }));
        let headerWidth;
        let headerHeight;
        if (headerItems.length > 0) {
          headerWidth = headerItems.reduce((sum, item, i) =>
            sum + (i > 0 ? colGap : 0) + measure(item.caption, captionFont, true) + captionGap + item.width, 0);
          headerHeight = headerValueSize * 1.2;
        } else {
          headerWidth = measure('TRACKS', captionFont, true);
          headerHeight = layout.titleHeight;
        }

        // Track rows: color bar, name, one right-aligned column per track stat
        const nameWidth = Math.max(...rows.map(t => measure(t.label, itemFont)));
        const columnWidths = trackDefs.map(def => Math.max(
          measure(def.template(statsUnits), valueFont),
          ...rows.map(t => measure(stats.tracks[t.id]?.[def.id] ?? '', valueFont))
        ));
        const rowWidth = layout.barWidth + layout.barGap + nameWidth +
          columnWidths.reduce((sum, w) => sum + colGap + w, 0);

        // Footer rows: pair stats (e.g. GAP Kai-Kimo 160 ft)
        const pairName = gapTracks ? `${gapTracks[0].label} \u2013 ${gapTracks[1].label}` : '';
        const footerItems = pairDefs.map(def => {
          const caption = def.short || def.label.toUpperCase();
          const valueWidth = Math.max(measure(def.template(statsUnits), valueFont), measure(stats.pair[def.id], valueFont));
          return {
            caption, value: stats.pair[def.id], valueWidth,
            width: measure(caption, captionFont, true) + captionGap + measure(pairName, itemFont) + colGap + valueWidth
          };
        });
        const footerHeight = footerItems.length * layout.rowHeight;

        const contentWidth = Math.max(headerWidth, rowWidth, ...footerItems.map(f => f.width));
        const panelWidth = 2 * layout.pad + contentWidth;
        const panelHeight = 2 * layout.pad + headerHeight + layout.titleGap + rows.length * layout.rowHeight +
          (footerItems.length > 0 ? layout.titleGap + footerHeight : 0);

        const isRight = legendPosition === 'top-right' || legendPosition === 'bottom-right';
        const isTop = legendPosition === 'top-left' || legendPosition === 'top-right';
        const bottomMargin = isRight ? Math.max(layout.margin, bottomReserve) : layout.margin;
        const x0 = isRight ? frameWidth - panelWidth - layout.margin : layout.margin;
        const y0 = isTop ? layout.margin : frameHeight - panelHeight - bottomMargin;

        // Background
        ctx.fillStyle = 'rgba(45, 45, 45, 0.95)';
        ctx.beginPath();
        if (typeof ctx.roundRect === 'function') {
          ctx.roundRect(x0, y0, panelWidth, panelHeight, layout.radius);
        } else {
          ctx.rect(x0, y0, panelWidth, panelHeight);
        }
        ctx.fill();
        ctx.textBaseline = 'middle';

        const left = x0 + layout.pad;
        const right = x0 + panelWidth - layout.pad;
        let y = y0 + layout.pad;

        // Header
        const headerMid = y + headerHeight / 2;
        if (headerItems.length > 0) {
          let x = left;
          headerItems.forEach((item, i) => {
            if (i > 0) x += colGap;
            drawText(item.caption, x, headerMid, captionFont, '#999', 'left', true);
            x += measure(item.caption, captionFont, true) + captionGap;
            drawText(item.value, x, headerMid, headerValueFont, '#ffffff');
            x += item.width;
          });
        } else {
          drawText('TRACKS', left, headerMid, captionFont, '#999', 'left', true);
        }
        y += headerHeight + layout.titleGap;

        // Track rows
        rows.forEach(track => {
          const mid = y + layout.rowHeight / 2;
          ctx.fillStyle = track.color;
          ctx.fillRect(left, mid - layout.barHeight / 2, layout.barWidth, layout.barHeight);
          drawText(track.label, left + layout.barWidth + layout.barGap, mid, itemFont, '#ffffff');
          let colRight = left + layout.barWidth + layout.barGap + nameWidth;
          trackDefs.forEach((def, i) => {
            colRight += colGap + columnWidths[i];
            drawText(stats.tracks[track.id]?.[def.id] ?? '', colRight, mid, valueFont, '#ffffff', 'right');
          });
          y += layout.rowHeight;
        });

        // Footer rows
        if (footerItems.length > 0) {
          y += layout.titleGap;
          footerItems.forEach(item => {
            const mid = y + layout.rowHeight / 2;
            drawText(item.caption, left, mid, captionFont, '#999', 'left', true);
            drawText(pairName, left + measure(item.caption, captionFont, true) + captionGap, mid, itemFont, '#ffffff');
            drawText(item.value, right, mid, valueFont, '#ffffff', 'right');
            y += layout.rowHeight;
          });
        }
        ctx.restore();
      };

      // Redraw the preview legend/scoreboard overlay after every render (cheap:
      // one small panel). It lives on the reference-size surface, so it is
      // drawn at scale 1 and CSS-scaled with the map.
      const scoreboardCanvasRef = useRef(null);
      useEffect(() => {
        const canvas = scoreboardCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (!showLegend || isRendering || effectiveTracks.length === 0) return;
        drawScoreboard(ctx, canvas.width, canvas.height, 1, progress, bottomRightReserve);
      });

      const animate = (timestamp) => {
        if (!isPlayingRef.current || tracks.length === 0) {
          return;
        }

        if (!lastTimestampRef.current) {
          lastTimestampRef.current = timestamp;
        }

        const deltaTime = timestamp - lastTimestampRef.current;
        lastTimestampRef.current = timestamp;

        // Preview pacing matches the exported video exactly: the full animation
        // takes exportDuration seconds (which is derived from playback speed)
        const progressIncrement = (deltaTime / (exportDuration * 1000)) * 100;

        setProgress(prev => {
          const newProgress = prev + progressIncrement;
          if (newProgress >= 100) {
            setIsPlaying(false);
            isPlayingRef.current = false;
            lastTimestampRef.current = null;
            return 100;
          }
          return newProgress;
        });

        if (isPlayingRef.current) {
          animationFrameRef.current = requestAnimationFrame(animate);
        }
      };

      useEffect(() => {
        isPlayingRef.current = isPlaying;

        if (isPlaying) {
          lastTimestampRef.current = null; // Reset timestamp when starting
          animationFrameRef.current = requestAnimationFrame(animate);
        } else {
          if (animationFrameRef.current) {
            cancelAnimationFrame(animationFrameRef.current);
          }
          lastTimestampRef.current = null;
        }
      }, [isPlaying, exportDuration]);

      // Preload bundled example tracks so first-time visitors see the app working.
      // They are cleared automatically as soon as the user uploads their own files.
      useEffect(() => {
        const exampleFiles = ['examples/Kai.gpx', 'examples/Kimo.gpx'];
        let cancelled = false;

        (async () => {
          const loaded = [];
          for (const path of exampleFiles) {
            try {
              const resp = await fetch(path);
              if (!resp.ok) continue;
              const text = await resp.text();
              const track = parseGPX(text, path.split('/').pop());
              if (track && track.points.length > 0) {
                track.isExample = true;
                loaded.push(track);
              }
            } catch (e) {
              // Examples unavailable (offline, file://) - just start empty
            }
          }

          if (cancelled || loaded.length === 0) return;

          setTracks(prev => (prev.length > 0 ? prev : loaded)); // never clobber user uploads

          const allPoints = loaded.flatMap(t => t.points.map(p => [p.lat, p.lon]));
          if (allPoints.length > 0 && mapInstanceRef.current) {
            mapInstanceRef.current.fitBounds(L.latLngBounds(allPoints), { padding: [50, 50] });
          }
        })();

        return () => { cancelled = true; };
      }, []);

      // Warn before leaving the page while a video export is in progress
      useEffect(() => {
        if (!isRendering) return;
        const handler = (e) => {
          e.preventDefault();
          e.returnValue = '';
        };
        window.addEventListener('beforeunload', handler);
        return () => window.removeEventListener('beforeunload', handler);
      }, [isRendering]);

      // Common-point picking: while active, clicking the map sets the point
      useEffect(() => {
        if (!isPickingPoint || !mapInstanceRef.current) return;
        const map = mapInstanceRef.current;
        map.getContainer().classList.add('picking-point');
        const onMapClick = (e) => {
          setAlignPoint({ lat: e.latlng.lat, lng: e.latlng.lng });
          setIsPickingPoint(false);
        };
        map.on('click', onMapClick);
        return () => {
          map.off('click', onMapClick);
          map.getContainer().classList.remove('picking-point');
        };
      }, [isPickingPoint]);

      // Draw the common-point circle and per-track match markers.
      // Removed while rendering video: with preferCanvas these layers would
      // otherwise be baked into the exported frames.
      const alignLayersRef = useRef([]);
      useEffect(() => {
        const map = mapInstanceRef.current;
        if (!map) return;
        alignLayersRef.current.forEach(layer => map.removeLayer(layer));
        alignLayersRef.current = [];
        if (!alignPoint || isRendering) return;

        const circle = L.circle([alignPoint.lat, alignPoint.lng], {
          radius: alignRadius,
          color: '#fc4c02',
          weight: 2,
          dashArray: '6 6',
          fillColor: '#fc4c02',
          fillOpacity: 0.08
        }).addTo(map);
        alignLayersRef.current.push(circle);

        effectiveTracks.forEach(track => {
          const match = alignmentMatches[track.id];
          if (!match) return;
          const p = track.points[match.index];
          const marker = L.circleMarker([p.lat, p.lon], {
            radius: 9,
            color: track.color,
            weight: 3,
            fill: false
          }).addTo(map);
          alignLayersRef.current.push(marker);
        });
      }, [alignPoint, alignRadius, alignmentMatches, effectiveTracks, isRendering]);

      const alignedMatchCount = effectiveTracks.filter(t => alignmentMatches[t.id]).length;

      const applyAlignment = () => {
        setAlignmentActive(true);
        setIsPlaying(false);
        setProgress(0);
      };

      const clearAlignment = () => {
        setAlignmentActive(false);
        setIsPickingPoint(false);
        setAlignPoint(null);
        setProgress(0);
      };

      // Store original bounds when tracks change
      useEffect(() => {
        if (tracks.length > 0 && mapInstanceRef.current) {
          const allPoints = [];
          effectiveTracks.forEach(track => {
            allPoints.push(...track.points.map(p => [p.lat, p.lon]));
          });
          if (allPoints.length > 0) {
            originalBoundsRef.current = L.latLngBounds(allPoints);
          }
        }
      }, [effectiveTracks]);

      useEffect(() => {
        // Clear existing polylines
        polylineRefs.current.forEach(line => {
          if (line && mapInstanceRef.current) {
            mapInstanceRef.current.removeLayer(line);
          }
        });
        polylineRefs.current = [];
        
        if (!mapInstanceRef.current || tracks.length === 0) return;
        
        // While picking/configuring the common point, always show full previews
        // so the user can see the overlaid tracks to click on
        const forcePreview = isPickingPoint || (alignPoint && !alignmentActive);

        effectiveTracks.forEach((track, trackIndex) => {
          const visiblePoints = getVisiblePoints(track, progress);

          if (showAllTracks || forcePreview) {
            // Show full track preview with track color at reduced opacity
            const fullLine = L.polyline(
              track.points.map(p => [p.lat, p.lon]),
              { color: track.color, weight: 2 * renderScale, opacity: 0.3 }
            ).addTo(mapInstanceRef.current);
            polylineRefs.current.push(fullLine);
          }
          
          if (visiblePoints.length > 0) {
            const animatedLine = L.polyline(
              visiblePoints.map(p => [p.lat, p.lon]),
              { color: track.color, weight: 4 * renderScale, opacity: 0.9 }
            ).addTo(mapInstanceRef.current);
            polylineRefs.current.push(animatedLine);
            
            // Add marker at current position
            const lastPoint = visiblePoints[visiblePoints.length - 1];
            const marker = L.circleMarker([lastPoint.lat, lastPoint.lon], {
              radius: 6 * renderScale,
              fillColor: track.color,
              color: '#fff',
              weight: 2 * renderScale,
              opacity: 1,
              fillOpacity: 1
            }).addTo(mapInstanceRef.current);
            polylineRefs.current.push(marker);
            
            // Add label that follows the current position
            if (track.label && showLabels) {
              const labelIcon = L.divIcon({
                className: 'map-label',
                html: `<div class="map-label" style="color: ${escapeHtml(track.color)}; font-size: ${labelSize * renderScale}px; font-family: ${escapeHtml(labelFont)}, sans-serif">${escapeHtml(track.label)}</div>`,
                iconSize: null,
                iconAnchor: [-15 * renderScale, 10 * renderScale]
              });

              const labelMarker = L.marker([lastPoint.lat, lastPoint.lon], {
                icon: labelIcon
              }).addTo(mapInstanceRef.current);
              polylineRefs.current.push(labelMarker);
            }
          }
        });
      }, [effectiveTracks, progress, showAllTracks, showLabels, labelFont, labelSize, animationStyle, alignmentActive, alignmentMatches, alignPoint, isPickingPoint, renderScale]);

      // Center of the followed track(s) at the given progress, or null if none visible yet.
      // Shared by the preview zoom-follow effect and renderExportFrame.
      const getFollowCenter = (progressPercent) => {
        const tracksToFollow = centeredTrackId
          ? effectiveTracks.filter(t => t.id == centeredTrackId) // Use == to handle string/number comparison
          : effectiveTracks;
        const positions = [];
        tracksToFollow.forEach((track) => {
          const visiblePoints = getVisiblePoints(track, progressPercent);
          if (visiblePoints.length > 0) {
            const lastPoint = visiblePoints[visiblePoints.length - 1];
            positions.push([lastPoint.lat, lastPoint.lon]);
          }
        });
        if (positions.length === 0) return null;
        return [
          positions.reduce((sum, pos) => sum + pos[0], 0) / positions.length,
          positions.reduce((sum, pos) => sum + pos[1], 0) / positions.length
        ];
      };

      // Keep Leaflet in sync with the surface size (not while exporting: the
      // export resizes the map element itself)
      useEffect(() => {
        if (!mapInstanceRef.current || exportScale !== null) return;
        mapInstanceRef.current.invalidateSize();
      }, [surfaceSize?.width, surfaceSize?.height, exportScale]);

      // Separate effect for zoom-to-track to prevent interruption during animation.
      // Skipped while exporting - renderExportFrame controls the view then.
      useEffect(() => {
        if (!mapInstanceRef.current || tracks.length === 0 || exportScale !== null) return;

        if (zoomToTrack && progress > 0 && progress < 100) {
          const center = getFollowCenter(progress);
          if (center) {

            console.log(`Export settings: ${exportWidth}x${exportHeight} @ ${targetFPS}fps, ${(targetBitrate/1000000).toFixed(1)} Mbps, ${exportQuality} quality`);
            setExportFormat('MP4');
            setIsRendering(true);
            setRenderProgress(0);
            exportStartTimeRef.current = Date.now();
            setIsRecording(true);
            isRecordingRef.current = true;
            renderCancelledRef.current = false;

            const blob = await exportWithWebCodecs(avcConfig, totalFrames, targetFPS, mapContainer, compositeCanvas, exportWidth, exportHeight);

            restoreMapSize(mapContainer);
            if (blob) {
              downloadVideoBlob(blob, 'mp4');
            }
            finishExport();
            return;
          }

          // ---------- FALLBACK PATH: MediaRecorder two-phase export ----------
          if (typeof MediaRecorder === 'undefined' || typeof compositeCanvas.captureStream !== 'function') {
            restoreMapSize(mapContainer);
            if (isIOS) {
              alert(
                '📱 Video Export Not Available on this iOS version\n\n' +
                'Video export requires iOS 16.4 or newer. Please update iOS, or use the built-in screen recording:\n\n' +
                '1. Open Control Center (swipe down from top-right)\n' +
                '2. Tap the Screen Recording button (circle icon)\n' +
                '3. Start your animation playback\n' +
                '4. Recording saves to Photos app\n\n' +
                '💻 Alternative: Use a desktop browser (Chrome, Firefox, or Edge) for built-in video export.'
              );
            } else {
              alert('Video export is not supported in this browser. Please use a recent version of Chrome, Edge, Firefox, or Safari.');
            }
            return;
          }

          // Use captureStream(0) for manual frame capture control
          // This gives us precise control over when frames are captured
          // We'll manually call requestFrame() after each frame is drawn
          const stream = compositeCanvas.captureStream(0);
          const videoTrack = stream.getVideoTracks()[0];
          compositeStreamRef.current = stream;

          let options = {
            videoBitsPerSecond: targetBitrate,
            bitsPerSecond: targetBitrate,
            frameRate: targetFPS  // Explicitly tell encoder the target frame rate
          };
          let mimeType = 'video/webm';
          let fileExtension = 'webm';

          // CODEC DETECTION & BROWSER COMPATIBILITY
          // Note: Safari does NOT support MP4/H.264 recording via MediaRecorder (as of 2025)
          // Safari only supports WebM (usually VP8, sometimes VP9)
          // This is a Safari/WebKit limitation, not a bug in this code

          // Debug: Log all supported formats (check browser console)
          console.log('=== Codec Support Detection ===');
          const testCodecs = [
            'video/mp4',
            'video/mp4;codecs=h264',
            'video/mp4;codecs=avc1',
            'video/mp4;codecs=avc1.42E01E',
            'video/webm',
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm;codecs=h264'
          ];
          testCodecs.forEach(codec => {
            const supported = MediaRecorder.isTypeSupported(codec);
            console.log(`${codec}: ${supported ? '✓ SUPPORTED' : '✗ not supported'}`);
          });
          console.log('==============================');

          // Try multiple MP4 formats (Safari may use different codec strings)
          // Note: As of 2025, no version of Safari supports MP4 recording
          const mp4Codecs = [
            'video/mp4;codecs=avc1.42E01E',  // H.264 baseline profile
            'video/mp4;codecs=avc1',         // Generic AVC/H.264
            'video/mp4;codecs=h264',         // Alternative H.264 format
            'video/mp4'                      // Generic MP4
          ];

          let mp4Supported = false;
          for (const codec of mp4Codecs) {
            if (MediaRecorder.isTypeSupported(codec)) {
              options.mimeType = codec;
              mimeType = 'video/mp4';
              fileExtension = 'mp4';
              mp4Supported = true;
              setExportFormat('MP4');
              console.log(`✓ Recording format: MP4 (${codec})`);
              console.log('→ Native MP4 output - no conversion needed!');
              break;
            }
          }

          // Fallback to WebM (Chrome, Firefox, Safari)
          if (!mp4Supported) {
            if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
              // WebM with VP9 codec (best quality, Chrome/Firefox)
              options.mimeType = 'video/webm;codecs=vp9';
              mimeType = 'video/webm';
              fileExtension = 'webm';
              setExportFormat('WebM (VP9)');
              console.log('✓ Recording format: WebM (VP9)');
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
              // WebM with VP8 codec (Safari, older browsers)
              options.mimeType = 'video/webm;codecs=vp8';
              mimeType = 'video/webm';
              fileExtension = 'webm';
              setExportFormat('WebM (VP8)');
              console.log('✓ Recording format: WebM (VP8)');
            } else if (MediaRecorder.isTypeSupported('video/webm')) {
              // WebM with default codec
              options.mimeType = 'video/webm';
              fileExtension = 'webm';
              setExportFormat('WebM');
              console.log('✓ Recording format: WebM (default codec)');
            }

            // Safari users: explain why they're getting WebM
            const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            if (isSafari) {
              console.log('→ Safari detected: MP4 recording not supported by Safari/WebKit');
              console.log('→ To convert WebM to MP4:');
              console.log('  • Use FFmpeg: ffmpeg -i video.webm -c:v libx264 video.mp4');
              console.log('  • Or online: https://cloudconvert.com/webm-to-mp4');
            } else {
              console.log('→ WebM output - use FFmpeg or CloudConvert to convert to MP4 if needed');
            }
          }

          console.log(`Export settings: ${exportWidth}x${exportHeight} @ ${targetFPS}fps, ${(targetBitrate/1000000).toFixed(1)} Mbps, ${exportQuality} quality`);

          const recorder = new MediaRecorder(stream, options);
          recordedChunksRef.current = [];
          mediaRecorderRef.current = recorder;

          recorder.ondataavailable = (e) => {
            if (e.data.size > 0) {
              recordedChunksRef.current.push(e.data);
            }
          };

          recorder.onstop = async () => {
            // Restore original map size
            restoreMapSize(mapContainer);

            if (recordedChunksRef.current.length === 0) {
              console.warn('No data recorded');
              setIsRendering(false);
              setIsRecording(false);
              setExportFormat('');
              isRecordingRef.current = false;
              return;
            }

            let blob = new Blob(recordedChunksRef.current, { type: mimeType });

            // DIAGNOSTIC: Inspect video metadata to measure actual encoded FPS
            console.log('\n=== Video Metadata Inspection ===');
            try {
              const blobUrl = URL.createObjectURL(blob);
              const videoElement = document.createElement('video');

              await new Promise((resolve, reject) => {
                videoElement.onloadedmetadata = async () => {
                  const actualDuration = videoElement.duration;
                  const expectedDuration = exportDuration;
                  const actualFPS = totalFrames / actualDuration;
                  const expectedFPS = targetFPS;
                  const durationRatio = actualDuration / expectedDuration;

                  console.log(`Expected: ${totalFrames} frames, ${expectedFPS} FPS, ${expectedDuration}s duration`);
                  console.log(`Actual video: ${actualDuration.toFixed(2)}s duration`);
                  console.log(`Calculated FPS: ${actualFPS.toFixed(2)} FPS`);
                  console.log(`Duration ratio: ${durationRatio.toFixed(2)}x (${durationRatio > 1 ? 'LONGER' : 'shorter'} than expected)`);

                  if (Math.abs(durationRatio - 1.0) > 0.1) {
                    console.warn(`⚠️  VIDEO DURATION MISMATCH DETECTED`);
                    console.warn(`Expected ${expectedDuration}s but got ${actualDuration.toFixed(2)}s`);
                    console.warn(`The browser's MediaRecorder encoded at ~${actualFPS.toFixed(1)} FPS instead of ${expectedFPS} FPS`);
                  } else {
                    console.log('✓ Video duration matches expected (within 10% tolerance)');
                  }

                  URL.revokeObjectURL(blobUrl);
                  resolve();
                };

                videoElement.onerror = (e) => {
                  console.error('Failed to load video metadata:', e);
                  URL.revokeObjectURL(blobUrl);
                  reject(e);
                };

                videoElement.src = blobUrl;
              });
            } catch (err) {
              console.error('Video metadata inspection failed:', err);
            }
            console.log('=================================\n');

            // Direct download (client-side recording)
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `gpx-animation-${Date.now()}.${fileExtension}`;
            a.click();
            URL.revokeObjectURL(url);

            // Cleanup
            setIsRendering(false);
            setIsRecording(false);
            setExportFormat('');
            isRecordingRef.current = false;

            if (compositeStreamRef.current) {
              compositeStreamRef.current.getTracks().forEach(track => track.stop());
              compositeStreamRef.current = null;
            }
            compositeCanvasRef.current = null;
            renderCancelledRef.current = false;
          };

          // Setup (don't start recording yet - wait for Phase 2)
          const frameDuration = 1000 / targetFPS; // ms per frame at target FPS

          setIsRecording(false); // Not recording yet
          setIsRendering(true);
          setRenderProgress(0);
          exportStartTimeRef.current = Date.now();
          isRecordingRef.current = false;
          renderCancelledRef.current = false;

          // TWO-PHASE EXPORT: Pre-render frames, then play back at correct FPS
          // Phase 1: Render all frames (slow, waits for tiles)
          // Phase 2: Play back frames at exact FPS while capturing
          console.log(`Starting 2-phase video export: ${totalFrames} frames at ${targetFPS} FPS`);
          console.log(`Phase 1: Pre-rendering ${totalFrames} frames (waits for tiles)`);

          const exportStartTime = Date.now();
          // Frames stored as compressed image blobs (WebP/PNG, hundreds of KB each)
          // instead of raw ImageData (~8 MB each at 1080p) to avoid exhausting RAM
          const renderedFrames = [];

          // PHASE 1: Pre-render all frames
          for (let frame = 0; frame <= totalFrames; frame++) {
            if (renderCancelledRef.current) {
              break;
            }

            await renderExportFrame(frame, totalFrames, mapContainer, compositeCanvas, exportWidth, exportHeight);

            // Save frame as compressed blob
            const frameBlob = await new Promise(resolve => compositeCanvas.toBlob(resolve, 'image/webp', 0.85));
            if (frameBlob) {
              renderedFrames.push(frameBlob);
            }

            // Log progress
            if (frame % 50 === 0) {
              console.log(`Pre-rendered frame ${frame}/${totalFrames} (${((frame / totalFrames) * 100).toFixed(1)}%)`);
            }
          }

          if (renderCancelledRef.current) {
            console.log('Export cancelled during pre-render phase');
            restoreMapSize(mapContainer);
            finishExport();
            return;
          }

          const preRenderTime = Date.now() - exportStartTime;
          console.log(`Phase 1 complete: ${renderedFrames.length} frames rendered in ${(preRenderTime/1000).toFixed(1)}s`);
          console.log(`Phase 2: Playing back frames at ${targetFPS} FPS while recording`);
          console.log(`⏱️  Playback will take ${exportDuration}s in real-time`);

          // START RECORDING NOW (only for Phase 2 playback)
          recorder.start(Math.max(10, Math.floor(frameDuration)));
          setIsRecording(true);
          isRecordingRef.current = true;
          console.log('🔴 Recording started');

          // PHASE 2: Play back frames at correct FPS
          const playbackStartTime = Date.now();
          exportStartTimeRef.current = playbackStartTime; // restart ETA for the realtime phase
          const playbackInterval = frameDuration; // Exact interval for target FPS

          // Pipeline frame decoding: decode the next frame during the wait for
          // the current frame's timeslot, so decode time doesn't eat the frame budget
          let nextBitmapPromise = renderedFrames.length > 0 ? createImageBitmap(renderedFrames[0]) : null;

          for (let i = 0; i < renderedFrames.length; i++) {
            if (renderCancelledRef.current) {
              break;
            }

            const targetTime = playbackStartTime + (i * playbackInterval);

            // Draw pre-decoded frame to canvas, kick off decoding the next one
            const ctx = compositeCanvas.getContext('2d');
            const frameBitmap = await nextBitmapPromise;
            if (i + 1 < renderedFrames.length) {
              nextBitmapPromise = createImageBitmap(renderedFrames[i + 1]);
            }
            ctx.drawImage(frameBitmap, 0, 0);
            frameBitmap.close();

            // Manually request frame capture - this ensures the frame is captured
            // exactly when we want it, eliminating timing jitter
            if (videoTrack.requestFrame) {
              videoTrack.requestFrame();
            }

            // Update progress
            const playbackProgress = (i / renderedFrames.length) * 100;
            setRenderProgress(playbackProgress);

            // Wait until exact target time for consistent FPS
            const now = Date.now();
            const waitTime = targetTime - now;
            if (waitTime > 0) {
              await new Promise(resolve => setTimeout(resolve, waitTime));
            }

            // Log every 30 frames
            if (i % 30 === 0) {
              const elapsed = (Date.now() - playbackStartTime) / 1000;
              console.log(`Playback: frame ${i}/${renderedFrames.length} (${elapsed.toFixed(1)}s elapsed)`);
            }
          }

          // Stop recording - show summary
          const totalExportTime = Date.now() - exportStartTime;
          const playbackTime = Date.now() - playbackStartTime;
          console.log(`\n=== Export Complete ===`);
          console.log(`Phase 1 (pre-render): ${(preRenderTime/1000).toFixed(1)}s`);
          console.log(`Phase 2 (playback): ${(playbackTime/1000).toFixed(1)}s`);
          console.log(`Total export time: ${(totalExportTime/1000).toFixed(1)}s`);
          console.log(`Frames rendered: ${renderedFrames.length}`);
          console.log(`Expected video: ${totalFrames} frames at ${targetFPS} FPS = ${exportDuration}s`);
          console.log(`\nℹ️  Video metadata will be inspected when encoding completes...`);
          console.log(`===================================\n`);

          if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
            mediaRecorderRef.current.stop();
          }

        } catch (err) {
          console.error('Recording error:', err);
          alert('Failed to start recording. Error: ' + err.message);

          // Restore original map size on error
          restoreMapSize(mapInstanceRef.current.getContainer());

          setIsRendering(false);
          setIsRecording(false);
          isRecordingRef.current = false;
        }
      };

      const stopRecording = () => {
        renderCancelledRef.current = true;

        if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
          mediaRecorderRef.current.stop();
        }

        // Update recording state
        isRecordingRef.current = false;
        setIsRendering(false);
        setIsRecording(false);
        setExportFormat('');

        // Cleanup composite canvas if it exists
        if (compositeStreamRef.current) {
          compositeStreamRef.current.getTracks().forEach(track => track.stop());
          compositeStreamRef.current = null;
        }
        compositeCanvasRef.current = null;
      };

      const totalPoints = effectiveTracks.reduce((sum, t) => sum + t.points.length, 0);
      const totalDistance = effectiveTracks.reduce((sum, track) => {
        let dist = 0;
        for (let i = 1; i < track.points.length; i++) {
          const p1 = track.points[i - 1];
          const p2 = track.points[i];
          dist += getDistance(p1, p2);
        }
        return sum + dist;
      }, 0);

      return (
        <>
          {/* Hamburger Menu Button (Mobile Only) */}
          <button
            className={`hamburger-btn ${isSidebarOpen ? 'open' : ''}`}
            onClick={toggleSidebar}
            aria-label="Toggle menu"
          >
            <div className="hamburger-line"></div>
            <div className="hamburger-line"></div>
            <div className="hamburger-line"></div>
          </button>

          {/* Backdrop Overlay (Mobile Only) */}
          <div
            className={`sidebar-backdrop ${isSidebarOpen ? 'show' : ''}`}
            onClick={closeSidebar}
          />

          <div className="header">
            <div className="header-content">
              <h1>🗺️ Flyin Amas GPX Track Animator</h1>
              <p>Upload your GPX files and create animated track videos</p>
            </div>
            <div style={{ display: 'flex', alignItems: 'center' }}>
              <div className="version">v{APP_VERSION}</div>
              <button className="help-btn" onClick={toggleHelpModal}>
                ❓ Help
              </button>
            </div>
          </div>
          
          <div className="main-container">
            <div className={`sidebar ${isSidebarOpen ? 'open' : ''}`}>
              <div className="sidebar-tabs" role="tablist">
                {SIDEBAR_TABS.map(tab => (
                  <button
                    key={tab.id}
                    role="tab"
                    aria-selected={activeTab === tab.id}
                    className={`sidebar-tab${activeTab === tab.id ? ' active' : ''}`}
                    onClick={() => setActiveTab(tab.id)}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              <div className="sidebar-content">
                {activeTab === 'tracks' && (
                  <>
                  <div 
                    className={`upload-zone ${dragOver ? 'dragover' : ''}`}
                    onClick={() => document.getElementById('file-input').click()}
                    onDrop={handleDrop}
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                  >
                    <div className="upload-icon">📁</div>
                    <div>Drop GPX files here or click to browse</div>
                    <input
                      id="file-input"
                      type="file"
                      className="file-input"
                      accept=".gpx"
                      multiple
                      onChange={(e) => handleFileUpload(e.target.files)}
                    />
                  </div>

                  {tracks.length > 0 && (
                    <div className="track-list">
                      <div className="control-label">Loaded Tracks ({tracks.length})</div>
                      {tracks.map(track => (
                        <div key={track.id} className="track-item">
                          <div className="track-header">
                            <span className="track-name" style={{ color: track.color }}>
                              {track.name}
                              {track.isExample && (
                                <span style={{ fontSize: '10px', color: '#999', backgroundColor: 'rgba(255,255,255,0.1)', borderRadius: '4px', padding: '1px 5px', marginLeft: '6px', verticalAlign: 'middle' }}>
                                  example
                                </span>
                              )}
                            </span>
                            <button 
                              className="track-remove"
                              onClick={() => removeTrack(track.id)}
                            >
                              ✕
                            </button>
                          </div>
                          <input
                            type="text"
                            className="track-label-input"
                            placeholder="Enter label (e.g., 'Morning Run', 'Bike Commute')"
                            value={track.label}
                            onChange={(e) => updateTrackLabel(track.id, e.target.value)}
                          />
                          <div className="track-color-picker">
                            <label>Color:</label>
                            <input
                              type="color"
                              value={track.color}
                              onChange={(e) => updateTrackColor(track.id, e.target.value)}
                            />
                            <button
                              className="btn btn-secondary"
                              style={{ fontSize: '11px', padding: '3px 8px', marginLeft: 'auto' }}
                              onClick={() => setTrimOpenId(trimOpenId === track.id ? null : track.id)}
                            >
                              ✂ Trim
                            </button>
                          </div>
                          {trimOpenId === track.id && (() => {
                            const lastIdx = track.points.length - 1;
                            const trimStart = track.trimStart ?? 0;
                            const trimEnd = track.trimEnd ?? lastIdx;
                            const kept = trimEnd - trimStart + 1;
                            return (
                              <div style={{ marginTop: '8px', padding: '8px', backgroundColor: 'rgba(255,255,255,0.04)', borderRadius: '6px' }}>
                                <label style={{ fontSize: '11px', color: '#999', display: 'block', marginBottom: '2px' }}>
                                  Trim start: point {trimStart}
                                </label>
                                <input
                                  type="range"
                                  className="slider"
                                  min="0"
                                  max={lastIdx}
                                  step="1"
                                  value={trimStart}
                                  onChange={(e) => updateTrackTrim(track.id, 'start', parseInt(e.target.value, 10))}
                                />
                                <label style={{ fontSize: '11px', color: '#999', display: 'block', margin: '6px 0 2px' }}>
                                  Trim end: point {trimEnd}
                                </label>
                                <input
                                  type="range"
                                  className="slider"
                                  min="0"
                                  max={lastIdx}
                                  step="1"
                                  value={trimEnd}
                                  onChange={(e) => updateTrackTrim(track.id, 'end', parseInt(e.target.value, 10))}
                                />
                                <div style={{ fontSize: '11px', color: '#ccc', marginTop: '6px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                  <span>Keeping {kept.toLocaleString()} of {track.points.length.toLocaleString()} points</span>
                                  {(trimStart > 0 || trimEnd < lastIdx) && (
                                    <button
                                      className="btn btn-secondary"
                                      style={{ fontSize: '11px', padding: '2px 8px' }}
                                      onClick={() => resetTrackTrim(track.id)}
                                    >
                                      Reset
                                    </button>
                                  )}
                                </div>
                              </div>
                            );
                          })()}
                        </div>
                      ))}
                    </div>
                  )}

                    {tracks.length > 0 && (
                      <>
                        <div className="controls">
                          <div className="control-group">
                            <div className="control-label">Animation Style</div>
                            <select
                              className="select"
                              value={animationStyle}
                              onChange={(e) => setAnimationStyle(e.target.value)}
                              disabled={alignmentActive}
                            >
                              <option value="sequential">Sequential (one after another)</option>
                              <option value="simultaneous">Simultaneous (all at once)</option>
                            </select>
                            {alignmentActive && (
                              <p style={{ fontSize: '11px', color: '#999', marginTop: '4px' }}>
                                Overridden while tracks are aligned at a common point.
                              </p>
                            )}
                          </div>

                          <div className="control-group">
                            <label className="checkbox-group">
                              <input
                                type="checkbox"
                                className="checkbox"
                                checked={showAllTracks}
                                onChange={(e) => setShowAllTracks(e.target.checked)}
                              />
                              <span>Show full track preview</span>
                            </label>
                          </div>

                          <div className="control-group">
                            <div className="control-label">Track Smoothing</div>
                            <select
                              className="select"
                              value={trackSmoothing}
                              onChange={(e) => setTrackSmoothing(e.target.value)}
                              disabled={isRecording}
                            >
                              <option value="off">Off (raw GPS points)</option>
                              <option value="light">Light</option>
                              <option value="medium">Medium</option>
                              <option value="strong">Strong</option>
                            </select>
                            <p style={{ fontSize: '11px', color: '#999', marginTop: '4px' }}>
                              Evens out GPS jitter so lines and the follow camera don't wobble. Stronger settings round off sharp turns.
                            </p>
                          </div>
                        </div>

                        {tracks.length >= 2 && (
                          <div className="controls">
                            <CollapsibleSection title="🏁 Compare Tracks">
                            <div className="control-group">
                              {alignmentActive && (
                                <div style={{ fontSize: '12px', color: '#fc4c02', fontWeight: 600, marginBottom: '8px' }}>
                                  Aligned — racing from common point
                                </div>
                              )}
                              <button
                                className={`btn ${isPickingPoint ? 'btn-primary' : 'btn-secondary'}`}
                                onClick={() => setIsPickingPoint(!isPickingPoint)}
                                disabled={isRecording || isRendering}
                                style={{ marginBottom: '8px' }}
                              >
                                {isPickingPoint ? '✕ Cancel pick' : (alignPoint ? '📍 Move common point' : '📍 Pick common point')}
                              </button>
                              {isPickingPoint && (
                                <p style={{ fontSize: '11px', color: '#999', marginBottom: '8px' }}>
                                  Click on the map where all tracks should be aligned.
                                </p>
                              )}
                              {alignPoint && (
                                <>
                                  <div style={{ marginBottom: '8px' }}>
                                    <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>
                                      Radius: {alignRadius} m
                                    </label>
                                    <input
                                      type="range"
                                      className="slider"
                                      min="5"
                                      max="500"
                                      step="5"
                                      value={alignRadius}
                                      onChange={(e) => setAlignRadius(parseInt(e.target.value, 10))}
                                      disabled={isRecording}
                                    />
                                  </div>
                                  <div style={{ marginBottom: '8px' }}>
                                    <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Align each track using</label>
                                    <select
                                      className="select"
                                      value={alignMethod}
                                      onChange={(e) => setAlignMethod(e.target.value)}
                                      disabled={isRecording}
                                    >
                                      <option value="closest">Closest point in circle</option>
                                      <option value="earliest">First pass through circle</option>
                                      <option value="latest">Last pass through circle</option>
                                    </select>
                                  </div>
                                  <div style={{ marginBottom: '8px' }}>
                                    {tracks.map(track => {
                                      const match = alignmentMatches[track.id];
                                      return (
                                        <div key={track.id} style={{ fontSize: '12px', marginBottom: '2px', color: match ? '#ccc' : '#e0a800' }}>
                                          <span style={{ display: 'inline-block', width: '10px', height: '10px', backgroundColor: track.color, borderRadius: '2px', marginRight: '6px' }}></span>
                                          {match
                                            ? `✓ ${track.label || 'Track'} — ${match.distanceM.toFixed(0)} m from point`
                                            : `⚠ ${track.label || 'Track'}: no point within radius`}
                                        </div>
                                      );
                                    })}
                                  </div>
                                  {!alignmentActive && (
                                    <button
                                      className="btn btn-primary"
                                      onClick={applyAlignment}
                                      disabled={alignedMatchCount < 2 || isRecording || isRendering}
                                      style={{ marginBottom: '8px' }}
                                    >
                                      ✓ Apply Alignment
                                    </button>
                                  )}
                                  <button
                                    className="btn btn-secondary"
                                    onClick={clearAlignment}
                                    disabled={isRecording || isRendering}
                                  >
                                    ✕ Clear
                                  </button>
                                  {alignedMatchCount < 2 && (
                                    <p style={{ fontSize: '11px', color: '#999', marginTop: '6px' }}>
                                      At least 2 tracks need a point inside the circle. Enlarge the radius or move the point.
                                    </p>
                                  )}
                                </>
                              )}
                            </div>
                            </CollapsibleSection>
                          </div>
                        )}

                        <div className="stats">
                          <div className="stat-row">
                            <span className="stat-label">Total Points:</span>
                            <span className="stat-value">{totalPoints.toLocaleString()}</span>
                          </div>
                          <div className="stat-row">
                            <span className="stat-label">Total Distance:</span>
                            <span className="stat-value">{totalDistance.toFixed(2)} km</span>
                          </div>
                          <div className="stat-row">
                            <span className="stat-label">Tracks Loaded:</span>
                            <span className="stat-value">{tracks.length}</span>
                          </div>
                          {alignmentActive && alignedTiming.spanMs > 0 && (
                            <div className="stat-row">
                              <span className="stat-label">Race Time:</span>
                              <span className="stat-value">
                                {(() => {
                                  const totalSec = Math.floor(((progress / 100) * alignedTiming.spanMs) / 1000);
                                  const min = Math.floor(totalSec / 60);
                                  const sec = totalSec % 60;
                                  return `${min}:${String(sec).padStart(2, '0')}`;
                                })()}
                              </span>
                            </div>
                          )}
                          {!alignmentActive && animationStyle === 'simultaneous' && effectiveTracks.some(t => t.startTime) && (
                            <div className="stat-row">
                              <span className="stat-label">Time Range:</span>
                              <span className="stat-value">
                                {(() => {
                                  const tracksWithTime = effectiveTracks.filter(t => t.startTime && t.endTime);
                                  if (tracksWithTime.length === 0) return 'N/A';
                                  const earliestStart = new Date(Math.min(...tracksWithTime.map(t => t.startTime.getTime())));
                                  const latestEnd = new Date(Math.max(...tracksWithTime.map(t => t.endTime.getTime())));
                                  return `${earliestStart.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })} - ${latestEnd.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}`;
                                })()}
                              </span>
                            </div>
                          )}
                          {!alignmentActive && animationStyle === 'simultaneous' && effectiveTracks.some(t => t.startTime) && progress > 0 && (
                            <div className="stat-row">
                              <span className="stat-label">Current Time:</span>
                              <span className="stat-value">
                                {(() => {
                                  const tracksWithTime = effectiveTracks.filter(t => t.startTime && t.endTime);
                                  if (tracksWithTime.length === 0) return 'N/A';
                                  const earliestStart = Math.min(...tracksWithTime.map(t => t.startTime.getTime()));
                                  const latestEnd = Math.max(...tracksWithTime.map(t => t.endTime.getTime()));
                                  const totalTimeSpan = latestEnd - earliestStart;
                                  const currentAbsoluteTime = earliestStart + (progress / 100) * totalTimeSpan;
                                  const currentDate = new Date(currentAbsoluteTime);
                                  return currentDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                                })()}
                              </span>
                            </div>
                          )}
                        </div>
                      </>
                    )}
                  </>
                )}

                {activeTab !== 'tracks' && tracks.length === 0 && (
                  <p className="sidebar-empty">Load GPX tracks in the Tracks tab first.</p>
                )}

                {activeTab === 'camera' && tracks.length > 0 && (
                  <div className="controls">
                    <div className="control-group">
                      <label className="checkbox-group">
                        <input
                          type="checkbox"
                          className="checkbox"
                          checked={zoomToTrack}
                          onChange={(e) => setZoomToTrack(e.target.checked)}
                        />
                        <span>Zoom to track during playback</span>
                      </label>
                    </div>

                    {zoomToTrack && (
                      <>
                        <div className="control-group">
                          <div className="control-label">Centered Track</div>
                          <select
                            className="select"
                            value={centeredTrackId || ''}
                            onChange={(e) => setCenteredTrackId(e.target.value ? e.target.value : null)}
                          >
                            <option value="">All Tracks (Default)</option>
                            {tracks.map(track => (
                              <option key={track.id} value={track.id}>{track.label}</option>
                            ))}
                          </select>
                        </div>
                        <div className="control-group">
                          {(() => {
                            const baseZoomLevel = 15; // Default zoom level
                            const relativeZoom = zoomLevel - baseZoomLevel;
                            const displayZoom = relativeZoom > 0 ? `+${relativeZoom}` : relativeZoom === 0 ? '0' : `${relativeZoom}`;
                            return (
                              <>
                                <div className="control-label">Zoom Level: {displayZoom}</div>
                                <input
                                  type="range"
                                  className="slider"
                                  min="12"
                                  max="18"
                                  step="1"
                                  value={zoomLevel}
                                  onChange={(e) => setZoomLevel(parseInt(e.target.value))}
                                />
                              </>
                            );
                          })()}
                        </div>
                      </>
                    )}
                  </div>
                )}

                {activeTab === 'overlays' && tracks.length > 0 && (
                  <>
                    <div className="controls">
                      <CollapsibleSection title="Video Title">
                      <div className="control-group">
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Title Text</label>
                          <input
                            type="text"
                            className="select"
                            value={videoTitle}
                            onChange={(e) => setVideoTitle(e.target.value)}
                            placeholder="Enter title (optional)"
                            disabled={isRecording}
                            style={{ width: '100%', fontFamily: 'inherit' }}
                          />
                        </div>
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Position</label>
                          <select
                            className="select"
                            value={titlePosition}
                            onChange={(e) => setTitlePosition(e.target.value)}
                            disabled={isRecording}
                          >
                            <option value="top-left">Top Left</option>
                            <option value="top-center">Top Center</option>
                            <option value="top-right">Top Right</option>
                            <option value="bottom-left">Bottom Left</option>
                            <option value="bottom-center">Bottom Center</option>
                            <option value="bottom-right">Bottom Right</option>
                          </select>
                        </div>
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Font Size: {titleSize}px</label>
                          <input
                            type="range"
                            min="16"
                            max="72"
                            step="2"
                            value={titleSize}
                            onChange={(e) => setTitleSize(parseInt(e.target.value))}
                            disabled={isRecording}
                            style={{ width: '100%' }}
                          />
                        </div>
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Font</label>
                          <select
                            className="select"
                            value={titleFont}
                            onChange={(e) => setTitleFont(e.target.value)}
                            disabled={isRecording}
                          >
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                          </select>
                        </div>
                        <div style={{ marginBottom: '12px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Color</label>
                          <input
                            type="color"
                            value={titleColor}
                            onChange={(e) => setTitleColor(e.target.value)}
                            disabled={isRecording}
                            style={{ width: '100%', height: '32px', cursor: 'pointer' }}
                          />
                        </div>

                      </div>
                      </CollapsibleSection>
                    </div>

                    <div className="controls">
                      <CollapsibleSection title="Scoreboard & Stats">
                      <div className="control-group">
                        <label className="checkbox-group">
                          <input
                            type="checkbox"
                            className="checkbox"
                            checked={showLegend}
                            onChange={(e) => setShowLegend(e.target.checked)}
                          />
                          <span>Show legend / scoreboard</span>
                        </label>
                      </div>

                      {showLegend && (
                        <>
                          <div className="control-group">
                            <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Position</label>
                            <select
                              className="select"
                              value={legendPosition}
                              onChange={(e) => setLegendPosition(e.target.value)}
                              style={{ width: '100%', marginBottom: '8px' }}
