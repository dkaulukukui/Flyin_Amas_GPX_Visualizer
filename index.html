                            >
                              <option value="top-left">Top Left</option>
                              <option value="top-right">Top Right</option>
                              <option value="bottom-left">Bottom Left</option>
                              <option value="bottom-right">Bottom Right</option>
                            </select>
                            <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Font</label>
                            <select
                              className="select"
                              value={scoreboardFont}
                              onChange={(e) => setScoreboardFont(e.target.value)}
                              disabled={isRecording}
                              style={{ width: '100%', marginBottom: '8px' }}
                            >
                              {SCOREBOARD_FONTS.map(f => (
                                <option key={f.label} value={f.value}>{f.label}</option>
                              ))}
                            </select>
                            <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Size: {legendSize}px</label>
                            <input
                              type="range"
                              className="slider"
                              min="10"
                              max="40"
                              step="1"
                              value={legendSize}
                              onChange={(e) => setLegendSize(parseInt(e.target.value, 10))}
                              disabled={isRecording}
                            />
                          </div>

                          <div className="control-group">
                            <div className="control-label">Stats</div>
                            {STAT_DEFINITIONS.map(def => {
                              const available = isStatAvailable(def);
                              const reason = def.requires ? 'no data in these tracks' : 'needs 2+ tracks';
                              return (
                                <label key={def.id} className="checkbox-group" style={{ opacity: available ? 1 : 0.5 }}>
                                  <input
                                    type="checkbox"
                                    className="checkbox"
                                    checked={!!statsEnabled[def.id] && available}
                                    onChange={(e) => setStatsEnabled(prev => ({ ...prev, [def.id]: e.target.checked }))}
                                    disabled={isRecording || !available}
                                  />
                                  <span>{def.label}{available ? '' : ` (${reason})`}</span>
                                </label>
                              );
                            })}
                            {statsEnabled.gap && gapTracks && (
                              <div style={{ display: 'flex', gap: '6px', alignItems: 'center', marginLeft: '24px', marginTop: '4px' }}>
                                {[0, 1].map(i => (
                                  <select
                                    key={i}
                                    className="select"
                                    value={gapTracks[i].id}
                                    onChange={(e) => {
                                      const value = e.target.value;
                                      setStatsGapIds(prev => {
                                        const next = [...prev];
                                        next[i] = value;
                                        return next;
                                      });
                                    }}
                                    disabled={isRecording}
                                    style={{ flex: 1, minWidth: 0 }}
                                  >
                                    {tracks.map(t => (
                                      <option key={t.id} value={t.id}>{t.label}</option>
                                    ))}
                                  </select>
                                ))}
                              </div>
                            )}
                          </div>

                          {activeStats.length > 0 && (
                            <>
                              <div className="control-group">
                                <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Units</label>
                                <select
                                  className="select"
                                  value={statsUnits}
                                  onChange={(e) => setStatsUnits(e.target.value)}
                                  disabled={isRecording}
                                  style={{ width: '100%' }}
                                >
                                  {Object.entries(STAT_UNITS).map(([key, u]) => (
                                    <option key={key} value={key}>{u.label}</option>
                                  ))}
                                </select>
                              </div>

                              <div className="control-group">
                                <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Stats Start</label>
                                <div className="button-group">
                                  <button
                                    className="btn btn-secondary"
                                    onClick={() => setStatsStartProgress(progress)}
                                    disabled={isRecording}
                                  >
                                    {'\u2691'} Set start here
                                  </button>
                                  <button
                                    className="btn btn-secondary"
                                    onClick={() => setStatsStartProgress(0)}
                                    disabled={isRecording || statsStartProgress === 0}
                                  >
                                    Reset
                                  </button>
                                </div>
                                <p style={{ fontSize: '11px', color: '#999', marginTop: '4px' }}>
                                  {statsStartProgress === 0
                                    ? 'Timer and distance start at the beginning. Scrub to the race start and click "Set start here" to change it.'
                                    : `Timer and distance start ${((statsStartProgress / 100) * exportDuration).toFixed(1)}s into the video (orange mark on the playback bar); the timer counts down before it.`}
                                </p>
                              </div>
                            </>
                          )}
                        </>
                      )}
                      </CollapsibleSection>
                    </div>

                    <div className="controls">
                      <CollapsibleSection title="Track Labels" defaultOpen={false}>
                      <div className="control-group">
                        <label className="checkbox-group">
                          <input
                            type="checkbox"
                            className="checkbox"
                            checked={showLabels}
                            onChange={(e) => setShowLabels(e.target.checked)}
                          />
                          <span>Show track labels</span>
                        </label>
                      </div>

                      {showLabels && (
                        <div style={{ marginBottom: '12px', marginLeft: '24px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Label Font</label>
                          <select
                            className="select"
                            value={labelFont}
                            onChange={(e) => setLabelFont(e.target.value)}
                            disabled={isRecording}
                            style={{ marginBottom: '8px' }}
                          >
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                          </select>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Label Size: {labelSize}px</label>
                          <input
                            type="range"
                            className="slider"
                            min="10"
                            max="32"
                            step="1"
                            value={labelSize}
                            onChange={(e) => setLabelSize(parseInt(e.target.value, 10))}
                            disabled={isRecording}
                          />
                        </div>
                      )}
                      </CollapsibleSection>
                    </div>

                    <div className="controls">
                      <CollapsibleSection title="Watermark" defaultOpen={false}>
                      <div className="control-group">
                        <label className="checkbox-group">
                          <input
                            type="checkbox"
                            className="checkbox"
                            checked={showWatermark}
                            onChange={(e) => setShowWatermark(e.target.checked)}
                            disabled={isRecording}
                          />
                          <span>Show watermark</span>
                        </label>
                      </div>

                      {showWatermark && (
                        <div style={{ marginBottom: '12px', marginLeft: '24px' }}>
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Watermark Text</label>
                          <input
                            type="text"
                            className="select"
                            value={watermarkText}
                            onChange={(e) => setWatermarkText(e.target.value)}
                            placeholder={DEFAULT_WATERMARK_TEXT}
                            disabled={isRecording}
                            style={{ width: '100%', fontFamily: 'inherit', marginBottom: '8px' }}
                          />
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Watermark Size: {watermarkSize}px</label>
                          <input
                            type="range"
                            className="slider"
                            min="8"
                            max="32"
                            step="1"
                            value={watermarkSize}
                            onChange={(e) => setWatermarkSize(parseInt(e.target.value, 10))}
                            disabled={isRecording}
                          />
                          <label style={{ fontSize: '12px', color: '#999', display: 'block', marginTop: '8px', marginBottom: '4px' }}>Watermark Opacity: {watermarkOpacity}%</label>
                          <input
                            type="range"
                            className="slider"
                            min="10"
                            max="100"
                            step="5"
                            value={watermarkOpacity}
                            onChange={(e) => setWatermarkOpacity(parseInt(e.target.value, 10))}
                            disabled={isRecording}
                          />
                        </div>
                      )}
                      </CollapsibleSection>
                    </div>
                  </>
                )}

                {activeTab === 'export' && tracks.length > 0 && (
                  <div className="controls">
                    <div className="control-group">
                      <div style={{ marginBottom: '12px' }}>
                        <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Aspect Ratio</label>
                        <select
                          className="select"
                          value={exportAspectRatio}
                          onChange={(e) => setExportAspectRatio(e.target.value)}
                          disabled={isRecording}
                        >
                          <option value="16:9">16:9 (Widescreen)</option>
                          <option value="9:16">9:16 (Vertical - Reels/TikTok/Shorts)</option>
                          <option value="4:3">4:3 (Standard)</option>
                        </select>
                      </div>
                      <div style={{ marginBottom: '12px' }}>
                        <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Resolution</label>
                        <select
                          className="select"
                          value={exportResolution}
                          onChange={(e) => setExportResolution(e.target.value)}
                          disabled={isRecording}
                        >
                          {exportAspectRatio === '16:9' ? (
                            <>
                              <option value="1920x1080">1920x1080 (Full HD)</option>
                              <option value="1280x720">1280x720 (HD)</option>
                              <option value="3840x2160">3840x2160 (4K)</option>
                            </>
                          ) : exportAspectRatio === '9:16' ? (
                            <>
                              <option value="1080x1920">1080x1920 (Full HD)</option>
                              <option value="720x1280">720x1280 (HD)</option>
                              <option value="2160x3840">2160x3840 (4K)</option>
                            </>
                          ) : (
                            <>
                              <option value="1920x1440">1920x1440 (High)</option>
                              <option value="1280x960">1280x960 (Medium)</option>
                              <option value="2560x1920">2560x1920 (Ultra)</option>
                            </>
                          )}
                        </select>
                      </div>
                      <div style={{ marginBottom: '12px' }}>
                        <label className="checkbox-group">
                          <input
                            type="checkbox"
                            className="checkbox"
                            checked={matchVideoFrame}
                            onChange={(e) => setMatchVideoFrame(e.target.checked)}
                            disabled={isRecording}
                          />
                          <span>Show video frame in preview</span>
                        </label>
                        <p style={{ fontSize: '11px', color: '#999', marginTop: '4px' }}>
                          Crops the map to the video's aspect ratio so the preview shows exactly what gets exported.
                          Every resolution shows the same area; higher ones are just sharper.
                        </p>
                      </div>
                      <div style={{ marginBottom: '12px' }}>
                        <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Quality</label>
                        <select
                          className="select"
                          value={exportQuality}
                          onChange={(e) => setExportQuality(e.target.value)}
                          disabled={isRecording}
                        >
                          <option value="low">Low (~8 Mbps)</option>
                          <option value="medium">Medium (~15 Mbps)</option>
                          <option value="high">High (~25 Mbps) - Recommended</option>
                          <option value="ultra">Ultra (~40 Mbps)</option>
                        </select>
                      </div>
                      <div style={{ marginBottom: '12px' }}>
                        <label style={{ fontSize: '12px', color: '#999', display: 'block', marginBottom: '4px' }}>Frame Rate</label>
                        <select
                          className="select"
                          value={exportFPS}
                          onChange={(e) => setExportFPS(parseInt(e.target.value))}
                          disabled={isRecording}
                        >
                          <option value="24">24 FPS (Cinematic)</option>
                          <option value="30">30 FPS (Standard)</option>
                          <option value="60">60 FPS (Smooth)</option>
                        </select>
                      </div>
                      <div style={{ marginBottom: '12px', padding: '10px', backgroundColor: 'rgba(252, 76, 2, 0.1)', borderRadius: '6px', border: '1px solid rgba(252, 76, 2, 0.3)' }}>
                        <label style={{ fontSize: '12px', color: '#ccc', display: 'block', marginBottom: '4px' }}>
                          Video Duration
                        </label>
                        <div style={{ fontSize: '18px', fontWeight: 'bold', color: '#fc4c02' }}>
                          {exportDuration}s
                          <span style={{ fontSize: '12px', fontWeight: 'normal', color: '#999', marginLeft: '8px' }}>
                            ({(exportDuration * exportFPS).toLocaleString()} frames)
                          </span>
                        </div>
                        <div style={{ fontSize: '10px', color: '#666', marginTop: '4px' }}>
                          Set with Duration under the map preview
                        </div>
                      </div>

                    </div>
                  </div>
                )}

                <button className="reset-settings-link" onClick={resetAllSettings} disabled={isRecording}>
                  Reset all settings to defaults
                </button>
              </div>

              {/* Pinned so exporting never needs scrolling */}
              <div className="sidebar-footer">
                <button
                  className="btn btn-primary"
                  onClick={isRecording ? stopRecording : startRecording}
                  disabled={tracks.length === 0 || isRendering || (isPlaying && !isRecording)}
                >
                  {isRecording ? '⏹ Stop Export' : '🎥 Export Video'}
                </button>
              </div>
            </div>
            
            <div className="map-container">
              {isRendering && (
                <div className="rendering-overlay">
                  <div className="rendering-content">
                    <div className="rendering-title">Rendering Video</div>
                    <div className="rendering-message">
                      Please wait while frames are being captured with fully loaded map tiles.
                      This process ensures high-quality output.
                    </div>
                    {exportFormat && (
                      <div className="export-format-indicator">
                        Format: {exportFormat}
                      </div>
                    )}
                    <div className="progress-text">{Math.round(renderProgress)}%</div>
                    <div className="progress-bar-container">
                      <div className="progress-bar-fill" style={{ width: `${renderProgress}%` }}></div>
                    </div>
                    {renderProgress > 2 && exportStartTimeRef.current && (
                      <div style={{ fontSize: '13px', color: '#ccc', marginTop: '8px' }}>
                        {(() => {
                          const elapsed = Date.now() - exportStartTimeRef.current;
                          const etaSec = Math.ceil((elapsed * (100 - renderProgress)) / renderProgress / 1000);
                          const min = Math.floor(etaSec / 60);
                          const sec = etaSec % 60;
                          return `Estimated time remaining: ~${min}:${String(sec).padStart(2, '0')}`;
                        })()}
                      </div>
                    )}
                    <div style={{ fontSize: '12px', color: '#e0a800', marginTop: '8px', marginBottom: '8px' }}>
                      ⚠️ Keep this tab open until the export finishes — closing or
                      switching away can interrupt the recording.
                    </div>
                    <button className="btn btn-secondary" onClick={stopRecording}>
                      Cancel
                    </button>
                  </div>
                </div>
              )}
              <div className="map-stage" ref={stageRef}>
              <div
                className={`map-frame${matchVideoFrame ? ' framed' : ''}`}
                style={previewFrame
                  ? { width: `${previewFrame.width}px`, height: `${previewFrame.height}px` }
                  : { width: '100%', height: '100%' }}
              >
              <div
                className="map-surface"
                style={{
                  width: surfaceSize ? `${surfaceSize.width}px` : '100%',
                  height: surfaceSize ? `${surfaceSize.height}px` : '100%',
                  transform: exportScale === null ? `scale(${displayScale})` : 'none',
                  '--ui-scale': 1 / displayScale
                }}
              >
              {/* Legend / scoreboard: drawn by drawScoreboard, like the export */}
              <canvas
                ref={scoreboardCanvasRef}
                className="map-scoreboard"
                width={surfaceSize ? surfaceSize.width : 0}
                height={surfaceSize ? surfaceSize.height : 0}
                style={{ display: isRendering ? 'none' : 'block' }}
              />
              {videoTitle && videoTitle.trim() !== '' && (
                <div
                  className="map-title"
                  style={{
                    position: 'absolute',
                    ...(() => {
                      const padding = '30px';
                      const positions = {
                        'top-left': { top: padding, left: padding },
                        'top-center': { top: padding, left: '50%', transform: 'translateX(-50%)' },
                        'top-right': { top: padding, right: padding },
                        'bottom-left': { bottom: padding, left: padding },
                        'bottom-center': { bottom: padding, left: '50%', transform: 'translateX(-50%)' },
                        'bottom-right': { bottom: `${Math.max(30, bottomRightReserve)}px`, right: padding }
                      };
                      return positions[titlePosition] || positions['top-left'];
                    })(),
                    fontSize: `${titleSize}px`,
                    lineHeight: 1,
                    fontFamily: titleFont,
                    color: titleColor,
                    fontWeight: '700',
                    textShadow: '2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 2px rgba(0, 0, 0, 0.9), 1px -1px 2px rgba(0, 0, 0, 0.9), -1px 1px 2px rgba(0, 0, 0, 0.9)',
                    pointerEvents: 'none',
                    zIndex: 1000,
                    whiteSpace: 'nowrap'
                  }}
                >
                  {videoTitle}
                </div>
              )}
              {hasWatermark && (
                <div
                  className="map-watermark"
                  style={{
                    right: `${watermarkLayout.margin}px`,
                    bottom: `${watermarkLayout.margin}px`,
                    fontSize: `${watermarkLayout.font}px`,
                    lineHeight: `${watermarkLayout.lineHeight}px`,
                    opacity: watermarkOpacity / 100
                  }}
                >
                  {watermarkText}
                </div>
              )}
              <div id="map" ref={mapRef}></div>
              </div>
              </div>
              </div>

              {/* Transport bar: playback controls live under the preview, like a video editor */}
              <div className="transport-bar">
                <button
                  className="btn btn-primary transport-btn"
                  onClick={togglePlay}
                  disabled={tracks.length === 0 || isRecording}
                  title={isPlaying ? 'Pause' : 'Play'}
                >
                  {isPlaying ? '⏸' : '▶'}
                </button>
                <button
                  className="btn btn-secondary transport-btn"
                  onClick={resetAnimation}
                  disabled={tracks.length === 0 || isRecording}
                  title="Back to start"
                >
                  ↺
                </button>
                <div
                  className="progress-bar transport-scrubber"
                  onPointerDown={handleProgressBarPointerDown}
                >
                  <div
                    className="progress-fill"
                    style={{ width: `${progress}%` }}
                  />
                  {statsStartProgress > 0 && activeStats.length > 0 && showLegend && (
                    <div
                      className="stats-start-marker"
                      title="Stats start"
                      style={{ left: `${statsStartProgress}%` }}
                    />
                  )}
                </div>
                <span className="transport-time">
                  {formatRaceTime((progress / 100) * exportDuration * 1000)} / {formatRaceTime(exportDuration * 1000)}
                </span>
                <label className="transport-duration" title={`Length of the animation and exported video (${minVideoDuration}-${maxVideoDuration}s)`}>
                  Duration
                  <input
                    type="number"
                    min={minVideoDuration}
                    max={maxVideoDuration}
                    step="5"
                    value={exportDuration}
                    onChange={(e) => {
                      const v = parseInt(e.target.value, 10);
                      if (!isNaN(v)) setExportDuration(v);
                    }}
                    onBlur={(e) => {
                      const v = parseInt(e.target.value, 10);
                      setExportDuration(isNaN(v) ? 60 : Math.min(maxVideoDuration, Math.max(minVideoDuration, v)));
                    }}
                    disabled={isRecording}
                  />
                  s
                </label>
              </div>
            </div>
          </div>

          {/* Help Modal */}
          {isHelpModalOpen && (
            <div className="help-modal-overlay" onClick={closeHelpModal}>
              <div className="help-modal" onClick={(e) => e.stopPropagation()}>
                <div className="help-modal-header">
                  <h1 className="help-modal-title">Help & Guide</h1>
                  <button className="help-modal-close" onClick={closeHelpModal}>×</button>
                </div>
                <div className="help-modal-content">

                  {/* What is this app? */}
                  <div className="help-section">
                    <h2>What is Flyin Amas GPX Track Animator?</h2>
                    <p>
                      This web application allows you to visualize and animate GPS tracks from GPX files.
                      Upload your GPS data from activities like running, cycling, paddling, or flying, and
                      create beautiful animated videos showing your route on a satellite map.
                    </p>
                    <div className="feature-list">
                      <ul>
                        <li>Animate single or multiple GPS tracks simultaneously</li>
                        <li>Customize track colors, labels, and appearance</li>
                        <li>Export high-quality videos (up to 4K resolution)</li>
                        <li>Control animation duration, zoom, and playback style</li>
                        <li>Add custom video titles and legends</li>
                        <li>Works entirely in your browser - no server upload required</li>
                      </ul>
                    </div>
                  </div>

                  {/* How to use */}
                  <div className="help-section">
                    <h2>How to Use</h2>
                    <ol>
                      <li><strong>Upload GPX files:</strong> Drag and drop your GPX files into the upload zone, or click to browse</li>
                      <li><strong>Customize tracks:</strong> In the Tracks tab, edit track labels, change colors, trim, and smooth tracks</li>
                      <li><strong>Preview animation:</strong> Use the play bar under the map (▶, scrubber, Duration) - the preview shows exactly what the video will look like</li>
                      <li><strong>Adjust settings:</strong> Camera tab for zoom and follow; Overlays tab for the title, scoreboard &amp; stats, track labels, and watermark. Settings are remembered in this browser</li>
                      <li><strong>Compare tracks (optional):</strong> With 2+ tracks loaded, use "🏁 Compare Tracks" in the Tracks tab to pick a common point on the map, adjust the radius circle, and align tracks from different days to race from that point</li>
                      <li><strong>Export video:</strong> Pick the format in the Export tab (aspect ratio, resolution, quality, FPS) and click "Export Video" at the bottom of the sidebar</li>
                      <li><strong>Download:</strong> Wait for the export to complete, then download your animated video</li>
                    </ol>
                    <p>
                      <strong>Note for iOS/Android users:</strong> Video export works on iOS 16.4+ and modern Android browsers
                      (exported as MP4). On older iOS versions, use a desktop browser or iOS Screen Recording while playing the animation.
                    </p>
                  </div>

                  {/* FAQ */}
                  <div className="help-section">
                    <h2>Frequently Asked Questions</h2>

                    <div className="faq-item">
                      <div className="faq-question">What is a GPX file?</div>
                      <div className="faq-answer">
                        GPX (GPS Exchange Format) is a standard XML format for storing GPS data including waypoints,
                        routes, and tracks. It's universally supported by GPS devices and fitness tracking apps.
                        GPX files contain latitude/longitude coordinates and optionally timestamps, elevation,
                        and other metadata about your recorded activities.
                      </div>
                    </div>

                    <div className="faq-item">
                      <div className="faq-question">How do I get GPX files from my fitness tracking app?</div>
                      <div className="faq-answer">
                        Most fitness apps allow you to export your activities as GPX files. See the detailed
                        instructions below for popular apps like Strava, Garmin, and Paddle Logger.
                      </div>
                    </div>

                    <div className="faq-item">
                      <div className="faq-question">Can I animate multiple tracks at once?</div>
                      <div className="faq-answer">
                        Yes! Upload multiple GPX files and they'll all appear on the map. You can choose between
                        "Simultaneous" mode (all tracks animate based on their actual GPS timestamps) or "Sequential"
                        mode (tracks play one after another in upload order).
                      </div>
                    </div>

                    <div className="faq-item">
                      <div className="faq-question">What video formats are supported?</div>
                      <div className="faq-answer">
                        On modern browsers (Chrome, Edge, Firefox 130+, Safari 16.4+ including iOS) the app exports
                        MP4 (H.264) video, which plays everywhere and can be shared directly to social media.
                        Older browsers fall back to WebM format.
                      </div>
                    </div>

                    <div className="faq-item">
                      <div className="faq-question">How do I compare tracks recorded on different days?</div>
                      <div className="faq-answer">
                        Tracks from different days don't overlap in time, so "Simultaneous" mode can't race them.
                        Instead, open "🏁 Compare Tracks" in the Tracks tab: click "Pick common point" and click the map
                        where all tracks pass (e.g., a shared start line), adjust the radius circle so every track has
                        a point inside it, choose how to match (closest point, first pass, or last pass through the
                        circle), and click "Apply Alignment". All tracks will then animate from that point together,
                        each replaying at its actual recorded pace - a true race. Exported videos use the same alignment.
                      </div>
                    </div>

                    <div className="faq-item">
                      <div className="faq-question">Why is video export slow?</div>
                      <div className="faq-answer">
                        Each video frame is rendered with fully loaded map tiles, which means the app may wait for
                        tiles to download (especially with "Zoom to Track" enabled, where the view changes every frame).
                        Higher resolutions (like 4K), longer durations, and "Zoom to Track" significantly increase
                        export time. For faster exports, try lower resolutions, shorter durations, or disabling
                        "Zoom to Track".
                      </div>
                    </div>

                    <div className="faq-item">
                      <div className="faq-question">Is my GPS data uploaded to a server?</div>
                      <div className="faq-answer">
                        No! All processing happens entirely in your browser. Your GPX files are never uploaded to any
                        server - everything stays private on your device.
                      </div>
                    </div>
                  </div>

                  {/* How to download GPX files */}
                  <div className="help-section">
                    <h2>How to Download GPX Files from Popular Apps</h2>

                    <h3><span className="app-badge">STRAVA</span></h3>
                    <ol>
                      <li>Log in to <a href="https://www.strava.com" target="_blank" rel="noopener noreferrer">Strava.com</a> on a desktop browser</li>
                      <li>Navigate to your activity</li>
                      <li>Click the three-dot menu (⋯) in the top right</li>
                      <li>Select "Export GPX"</li>
                      <li>The GPX file will download to your computer</li>
                    </ol>
                    <p><strong>Bulk export:</strong> Go to Settings → My Account → Download or Delete Your Account →
                    Request Your Archive to download all activities at once.</p>

                    <h3><span className="app-badge">GARMIN CONNECT</span></h3>
                    <ol>
                      <li>Log in to <a href="https://connect.garmin.com" target="_blank" rel="noopener noreferrer">Garmin Connect</a></li>
                      <li>Open your activity</li>
                      <li>Click the gear icon (⚙️) in the top right</li>
                      <li>Select "Export to GPX"</li>
                      <li>Save the file to your computer</li>
                    </ol>
                    <p><strong>Note:</strong> You can also export from the Garmin Connect mobile app:
                    Open activity → Share icon → Export to GPX.</p>

                    <h3><span className="app-badge">PADDLE LOGGER</span></h3>
                    <ol>
                      <li>Open the Paddle Logger app</li>
                      <li>View your paddle session</li>
                      <li>Tap the Share/Export button</li>
                      <li>Select "Export as GPX"</li>
                      <li>Choose where to save or share the file</li>
                    </ol>
                    <p><strong>Tip:</strong> You can email the GPX file to yourself or save it to cloud storage
                    for easy access on your computer.</p>

                    <h3><span className="app-badge">APPLE HEALTH / WORKOUTS</span></h3>
                    <ol>
                      <li>Download a third-party app like "HealthFit" or "RunGap" from the App Store</li>
                      <li>Grant the app permission to read your Health data</li>
                      <li>Select the workout you want to export</li>
                      <li>Choose "Export as GPX"</li>
                      <li>Share or save the GPX file</li>
                    </ol>
                    <p><strong>Note:</strong> Apple Health doesn't natively export GPX files, so you'll need
                    a third-party app.</p>

                    <h3><span className="app-badge">KOMOOT</span></h3>
                    <ol>
                      <li>Go to <a href="https://www.komoot.com" target="_blank" rel="noopener noreferrer">Komoot.com</a></li>
                      <li>Open your completed tour</li>
                      <li>Click "Export" or the download icon</li>
                      <li>Select "GPX Track"</li>
                      <li>Download the file</li>
                    </ol>

                    <h3><span className="app-badge">RELIVE</span></h3>
                    <ol>
                      <li>Open your activity in the Relive app or website</li>
                      <li>Tap/click the Share button</li>
                      <li>Select "Export GPX"</li>
                      <li>Save or share the file</li>
                    </ol>

                    <h3><span className="app-badge">MAPMYRUN / MAPMYRIDE</span></h3>
                    <ol>
                      <li>Log in to <a href="https://www.mapmyrun.com" target="_blank" rel="noopener noreferrer">MapMyRun.com</a> or MapMyRide.com</li>
                      <li>Go to your workout details</li>
                      <li>Click the gear icon or "Export" button</li>
                      <li>Choose "Export as GPX"</li>
                      <li>Download the file</li>
                    </ol>

                    <h3><span className="app-badge">RIDE WITH GPS</span></h3>
                    <ol>
                      <li>Log in to <a href="https://ridewithgps.com" target="_blank" rel="noopener noreferrer">RideWithGPS.com</a></li>
                      <li>Open your ride/trip</li>
                      <li>Click "Export" in the menu</li>
                      <li>Select "GPX Track"</li>
                      <li>Download the file</li>
                    </ol>

                    <h3><span className="app-badge">WIKILOC</span></h3>
                    <ol>
                      <li>Go to <a href="https://www.wikiloc.com" target="_blank" rel="noopener noreferrer">Wikiloc.com</a></li>
                      <li>Open your trail</li>
                      <li>Click "Download" button</li>
                      <li>Select "GPX" format</li>
                      <li>Save the file</li>
                    </ol>

                    <p style={{ marginTop: '20px', fontStyle: 'italic', color: '#999' }}>
                      <strong>Can't find your app?</strong> Most fitness and GPS tracking apps support GPX export.
                      Look for "Export", "Share", or "Download" options in your activity details, or check the
                      app's help documentation.
                    </p>
                  </div>

                  {/* Tips & Tricks */}
                  <div className="help-section">
                    <h2>Tips & Tricks</h2>
                    <ul>
                      <li><strong>Best video quality:</strong> Use "High" or "Ultra" quality preset and 1080p or 4K resolution</li>
                      <li><strong>Smooth animation:</strong> Set FPS to 30 or 60 for fluid motion</li>
                      <li><strong>Quick exports:</strong> Disable "Zoom to Track" and use lower resolutions (720p)</li>
                      <li><strong>Compare routes:</strong> Upload multiple GPX files and use "Simultaneous" mode to see how they align</li>
                      <li><strong>Custom labels:</strong> Give your tracks meaningful names like "Morning Run" or "Weekend Ride"</li>
                      <li><strong>Perfect timing:</strong> Adjust video duration (5-300 seconds) to match your desired pacing</li>
                    </ul>
                  </div>

                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    ReactDOM.render(<GPXTrackAnimator />, document.getElementById('root'));
  </script>
</body>
</html>
